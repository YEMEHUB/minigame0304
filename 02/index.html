<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라바 3D: 숨겨진 소시지 대작전!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tone.js (코믹 효과음) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts: Jua -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
            background-color: #2b2419;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .cartoon-box {
            border: 3px solid #1e1b18;
            box-shadow: 0 5px 0 #1e1b18;
        }
        .larva-btn {
            border: 4px solid #1e1b18;
            box-shadow: 0 6px 0 #1e1b18, 0 10px 18px rgba(0,0,0,0.45);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .larva-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e1b18, 0 4px 8px rgba(0,0,0,0.45);
        }
        /* 피격 시 화면 붉은 점멸 효과 */
        @keyframes hitFlash {
            0% { background-color: rgba(220, 38, 38, 0.55); }
            100% { background-color: rgba(220, 38, 38, 0); }
        }
        .damage-flash {
            animation: hitFlash 0.45s ease-out forwards;
        }
        /* 나뭇잎 생명 흔들림 */
        @keyframes leafLost {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(25deg); opacity: 0.7; }
            100% { transform: scale(0.75) rotate(-15deg); opacity: 0.25; filter: grayscale(100%); }
        }
        .leaf-dead {
            animation: leafLost 0.4s forwards;
        }
    </style>
</head>
<body class="relative">

    <!-- 3D 렌더링 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 피격 오버레이 -->
    <div id="damageOverlay" class="pointer-events-none fixed inset-0 z-10"></div>

    <!-- 상단 HUD (좌측: 소시지 카운터 & 카메라 안내 / 우측: 나뭇잎 생명 5개) -->
    <div class="fixed top-0 left-0 right-0 p-3 sm:p-5 flex items-start justify-between pointer-events-none z-20">
        <!-- 좌측: 소시지 획득 현황 -->
        <div class="flex flex-col gap-2 pointer-events-auto">
            <div class="bg-amber-100/95 px-4 py-2 rounded-2xl cartoon-box flex items-center gap-2.5">
                <span class="text-2xl sm:text-3xl">🌭</span>
                <div>
                    <div class="text-xs text-stone-600 leading-none">숨겨진 칼집 소시지</div>
                    <div class="text-xl sm:text-2xl text-red-600 font-bold leading-tight">
                        <span id="sausageCount">0</span> / 7 개
                    </div>
                </div>
            </div>
            <div class="hidden sm:flex items-center gap-2 bg-stone-900/80 text-yellow-200 text-xs px-3 py-1.5 rounded-xl border border-yellow-400/30">
                <span>🖱️ 마우스 드래그: 시점 회전</span>
                <span>•</span>
                <span>WASD / 방향키: 이동</span>
                <span>•</span>
                <span>Space: 점프</span>
            </div>
        </div>

        <!-- 우측: 나뭇잎 모양 생명 3개 & 사운드 버튼 -->
        <div class="flex flex-col items-end gap-2 pointer-events-auto">
            <div class="bg-stone-900/90 px-3.5 py-2 rounded-2xl cartoon-box flex items-center gap-1.5" title="기회 (나뭇잎 3개)">
                <div id="leafLives" class="flex items-center gap-1">
                    <!-- JS로 3개의 나뭇잎 SVG 생성 -->
                </div>
            </div>
            <button id="soundToggle" class="bg-yellow-300 hover:bg-yellow-200 text-stone-900 px-3 py-1 rounded-xl cartoon-box text-xs sm:text-sm flex items-center gap-1">
                <span id="soundIcon">🔊</span>
                <span id="soundText">효과음 ON</span>
            </button>
        </div>
    </div>

    <!-- 바이올렛 경고 알림 배너 -->
    <div id="warningBanner" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-20 pointer-events-none">
        <div class="bg-purple-700 text-yellow-300 px-5 py-2 rounded-full cartoon-box text-sm sm:text-lg animate-bounce whitespace-nowrap">
            ⚠️ 바이올렛이 나타났다! 물리지 않게 도망치세요!
        </div>
    </div>

    <!-- 모바일 터치 컨트롤러 (하단 좌측 조이스틱 / 우측 점프 버튼) -->
    <div id="mobileControls" class="fixed bottom-4 left-4 right-4 flex items-end justify-between z-20 sm:hidden pointer-events-none">
        <!-- 가상 방향 패드 -->
        <div id="joystickZone" class="w-32 h-32 rounded-full bg-stone-900/45 border-4 border-yellow-300/60 relative pointer-events-auto flex items-center justify-center">
            <div id="joystickKnob" class="w-12 h-12 rounded-full bg-yellow-400 border-2 border-stone-900 shadow-lg pointer-events-none"></div>
        </div>
        <!-- 점프 버튼 -->
        <button id="mobileJumpBtn" class="w-20 h-20 rounded-full bg-red-500 active:bg-red-400 text-yellow-300 text-xl cartoon-box pointer-events-auto flex items-center justify-center">
            점프!
        </button>
    </div>

    <!-- 시작 / 게임오버 / 클리어 모달 -->
    <div id="overlayModal" class="fixed inset-0 bg-stone-950/75 backdrop-blur-sm flex items-center justify-center p-4 z-30">
        <div class="bg-amber-50 cartoon-box rounded-3xl max-w-md w-full p-6 text-center relative overflow-hidden">
            <div id="modalBadge" class="inline-block bg-red-600 text-yellow-300 px-4 py-1 rounded-full text-sm cartoon-box mb-3">
                🐛 LARVA 3D ADVENTURE
            </div>
            <h1 id="modalTitle" class="text-3xl sm:text-4xl text-stone-900 mb-2">
                흩어진 소시지 7개를 찾아라!
            </h1>
            <p id="modalDesc" class="text-stone-700 text-sm sm:text-base mb-5 leading-relaxed">
                하수구 바닥 여기저기 어지럽게 흩어진 <span class="text-red-600 font-bold">칼집 소시지 7개</span>를 <span class="text-amber-600 font-bold">옐로우</span>와 함께 모두 주우세요!<br>
                뒤따라오는 <span class="text-purple-700 font-bold">바이올렛</span>에게 <span class="text-green-700 font-bold">3번 물리면</span> 끝이니 조심하세요!
            </p>

            <!-- 조작 요약 카드 -->
            <div class="bg-amber-200/70 rounded-2xl p-3 mb-5 text-xs sm:text-sm text-stone-800 border-2 border-stone-900/20 space-y-1">
                <div>🕹️ <b>이동:</b> WASD / 방향키 (모바일: 왼쪽 스틱)</div>
                <div>🦘 <b>점프:</b> 스페이스바 (장애물 위로 점프!)</div>
                <div>🎥 <b>시점 회전:</b> 화면 마우스 드래그</div>
            </div>

            <button id="startBtn" class="larva-btn w-full py-4 rounded-2xl bg-red-500 hover:bg-red-400 text-yellow-300 text-2xl tracking-wide cursor-pointer">
                🌭 소시지 찾으러 출발!
            </button>
        </div>
    </div>

    <script>
        /**
         * 라바 3D: 숨겨진 소시지 8개 찾기 & 바이올렛 회피 게임
         * - 이미지(하수구 배관, 노란 전구, 녹색 전구, 병뚜껑, 통조림 뚜껑, 노란 나뭇잎, 이끼 벽)를 3D 무대로 재현
         * - 플레이어(레드) & 따라다니는 AI 파트너(옐로우)
         * - 숨겨진 칼집 소시지 8개 배치
         * - 땅속에서 예고 후 솟구쳐 공격하는 거대 보라색 벌레(바이올렛)
         */

        // --- 전역 변수 및 상태 ---
        let scene, camera, renderer;
        let redGroup, yellowGroup, violetGroup;
        let redPupils = [], yellowPupils = [];
        let sausages = [];
        let obstacles = []; // 점프하거나 돌아가야 하는 하수구 소품들
        let bulbLights = [];

        // 게임 상태
        let isPlaying = false;
        let lives = 3;
        const MAX_LIVES = 3;
        let collectedCount = 0;
        const TOTAL_SAUSAGES = 7;
        let isMuted = false;
        let invulnerableTimer = 0;
        let biteAnimTimer = 0;

        // 플레이어 물리 상태
        const playerPos = new THREE.Vector3(0, 0, 4);
        let playerVelY = 0;
        let isGrounded = true;
        let playerYaw = 0;

        // 옐로우 동료 위치 히스토리 (레드를 쫄쫄 따라다님)
        const yellowPos = new THREE.Vector3(-1.5, 0, 4.8);
        let yellowYaw = 0;

        // 카메라 궤도 각도 (마우스 드래그 회전 지원)
        let camAngleX = 0;
        let camAngleY = 0.36;
        let isDraggingCam = false;
        let prevMouseX = 0;
        let prevMouseY = 0;

        // 입력 상태
        const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };
        let joyVec = { x: 0, y: 0 };

        // 바이올렛(보라색 적) 상태 머신
        // 'WARNING' (땅 흔들림/1회 등장 예고) -> 'EMERGE' (땅속에서 솟구침) -> 'CHASE' (0.7배속으로 계속 추적하며 물기)
        const violetState = {
            phase: 'WARNING',
            timer: 1.8,
            pos: new THREE.Vector3(0, -6.5, -10),
            biteCooldown: 0
        };

        // DOM 요소
        const canvas = document.getElementById('gameCanvas');
        const leafLivesEl = document.getElementById('leafLives');
        const sausageCountEl = document.getElementById('sausageCount');
        const warningBanner = document.getElementById('warningBanner');
        const damageOverlay = document.getElementById('damageOverlay');
        const overlayModal = document.getElementById('overlayModal');
        const modalBadge = document.getElementById('modalBadge');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const startBtn = document.getElementById('startBtn');

        // --- Tone.js 코믹 효과음 ---
        let synth = null;
        let bassSynth = null;
        function initAudio() {
            if (!synth && typeof Tone !== 'undefined') {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0.05, release: 0.25 }
                }).toDestination();
                synth.volume.value = -6;

                bassSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.08,
                    octaves: 3,
                    oscillator: { type: 'sawtooth' }
                }).toDestination();
                bassSynth.volume.value = -3;
            }
        }

        function playSound(type) {
            if (isMuted) return;
            try {
                initAudio();
                if (Tone.context.state !== 'running') Tone.start();
                const now = Tone.now();
                if (type === 'jump') {
                    synth.triggerAttackRelease('G4', '16n', now);
                    synth.triggerAttackRelease('D5', '16n', now + 0.05);
                } else if (type === 'sausage') {
                    // 맛있는 소시지 획득 효과음
                    synth.triggerAttackRelease(['C5', 'E5', 'G5'], '16n', now);
                    synth.triggerAttackRelease('C6', '8n', now + 0.1);
                } else if (type === 'warning') {
                    // 바이올렛 등장 전 불길한 진동음
                    bassSynth.triggerAttackRelease('G1', '8n', now);
                    bassSynth.triggerAttackRelease('F#1', '8n', now + 0.18);
                } else if (type === 'roar') {
                    // 바이올렛 돌진 포효
                    bassSynth.triggerAttackRelease('C2', '4n', now);
                } else if (type === 'hit') {
                    // 피격 시 코믹 비명/방귀음
                    bassSynth.triggerAttackRelease('A2', '8n', now);
                    bassSynth.triggerAttackRelease('D2', '4n', now + 0.1);
                } else if (type === 'win') {
                    synth.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '8n', now);
                    synth.triggerAttackRelease(['E5', 'G5', 'B5', 'E6'], '4n', now + 0.2);
                }
            } catch (e) {}
        }

        // --- 우측 상단 나뭇잎 생명 3개 UI 렌더링 ---
        function renderLeafLives() {
            leafLivesEl.innerHTML = '';
            for (let i = 0; i < MAX_LIVES; i++) {
                const isAlive = i < lives;
                const leafWrapper = document.createElement('div');
                leafWrapper.className = `transition-all duration-300 ${isAlive ? 'scale-100 opacity-100' : 'leaf-dead'}`;
                // 첫 번째 첨부 이미지 바닥에 떨어진 노란/연두 나뭇잎 모양 SVG
                leafWrapper.innerHTML = `
                    <svg class="w-7 h-7 sm:w-8 sm:h-8 drop-shadow" viewBox="0 0 64 64">
                        <path d="M10 52 C14 26, 32 10, 56 10 C54 34, 38 50, 14 50 Z"
                              fill="${isAlive ? '#d9f99d' : '#78716c'}"
                              stroke="#1e1b18" stroke-width="3.5" stroke-linejoin="round"/>
                        <path d="M10 52 C24 40, 38 26, 54 12"
                              stroke="#65a30d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        <path d="M26 38 L22 28 M36 29 L33 20 M33 33 L42 35"
                              stroke="#65a30d" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </svg>
                `;
                leafLivesEl.appendChild(leafWrapper);
            }
        }

        // --- 절차적 텍스처 생성 (첨부된 하수구 배경 분위기 구현) ---
        function createSewerTextures() {
            // 1. 흙/모래 하수구 바닥 텍스처
            const floorCanvas = document.createElement('canvas');
            floorCanvas.width = 512;
            floorCanvas.height = 512;
            const fCtx = floorCanvas.getContext('2d');
            const grad = fCtx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#5c4928');
            grad.addColorStop(0.5, '#8a6830');
            grad.addColorStop(1, '#6b4f21');
            fCtx.fillStyle = grad;
            fCtx.fillRect(0, 0, 512, 512);

            // 자갈 및 얼룩 디테일
            for (let i = 0; i < 600; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const r = 1 + Math.random() * 5;
                fCtx.fillStyle = Math.random() > 0.5 ? 'rgba(40, 28, 12, 0.22)' : 'rgba(210, 175, 95, 0.18)';
                fCtx.beginPath();
                fCtx.arc(x, y, r, 0, Math.PI * 2);
                fCtx.fill();
            }
            const floorTex = new THREE.CanvasTexture(floorCanvas);
            floorTex.wrapS = THREE.RepeatWrapping;
            floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(6, 6);

            // 2. 이끼 낀 하수구 콘크리트 벽면 텍스처 (첨부 이미지의 배경 벽 느낌)
            const wallCanvas = document.createElement('canvas');
            wallCanvas.width = 1024;
            wallCanvas.height = 512;
            const wCtx = wallCanvas.getContext('2d');
            const wGrad = wCtx.createLinearGradient(0, 0, 0, 512);
            wGrad.addColorStop(0, '#787166');
            wGrad.addColorStop(0.35, '#9e9585');
            wGrad.addColorStop(0.75, '#7c7864');
            wGrad.addColorStop(1, '#475427');
            wCtx.fillStyle = wGrad;
            wCtx.fillRect(0, 0, 1024, 512);

            // 상단 빗살 무늬 빛줄기 (배경 이미지 상단 하이라이트 재현)
            wCtx.fillStyle = 'rgba(255, 248, 220, 0.14)';
            for (let x = 0; x < 1024; x += 36) {
                wCtx.beginPath();
                wCtx.moveTo(x, 0);
                wCtx.lineTo(x + 18, 0);
                wCtx.lineTo(x + 8, 130);
                wCtx.lineTo(x - 10, 130);
                wCtx.fill();
            }

            // 물때 얼룩 및 균열
            for (let i = 0; i < 90; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 420;
                wCtx.fillStyle = 'rgba(45, 42, 34, 0.12)';
                wCtx.beginPath();
                wCtx.ellipse(x, y, 10 + Math.random() * 35, 30 + Math.random() * 80, 0, 0, Math.PI * 2);
                wCtx.fill();
            }

            // 벽면 하단 초록 이끼 덤불 (배경 이미지 하단 초록 이끼 재현)
            for (let i = 0; i < 160; i++) {
                const x = Math.random() * 1024;
                const y = 350 + Math.random() * 160;
                const rad = 12 + Math.random() * 32;
                wCtx.fillStyle = Math.random() > 0.4 ? 'rgba(85, 118, 36, 0.55)' : 'rgba(54, 83, 20, 0.6)';
                wCtx.beginPath();
                wCtx.arc(x, y, rad, 0, Math.PI * 2);
                wCtx.fill();
            }
            const wallTex = new THREE.CanvasTexture(wallCanvas);
            wallTex.wrapS = THREE.RepeatWrapping;
            wallTex.wrapT = THREE.ClampToEdgeWrapping;
            wallTex.repeat.set(3, 1);

            return { floorTex, wallTex };
        }

        // --- 3D 환경 및 소품 구축 (첨부된 하수구 사진 요소들 반영) ---
        function buildSewerEnvironment() {
            const { floorTex, wallTex } = createSewerTextures();

            // 바닥
            const floorGeo = new THREE.CircleGeometry(22, 48);
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 원형 하수구 벽면
            const wallGeo = new THREE.CylinderGeometry(21.5, 21.5, 12, 48, 1, true);
            const wallMat = new THREE.MeshStandardMaterial({
                map: wallTex,
                side: THREE.BackSide,
                roughness: 0.85
            });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.y = 5.8;
            scene.add(wall);

            // 1. 왼쪽 거대 찌그러진 배수 파이프 (배경 이미지 좌측)
            const pipeGroup = new THREE.Group();
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x57534e, roughness: 0.6, metalness: 0.5, side: THREE.DoubleSide });
            const pipeBody = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 5.5, 24, 1, true), pipeMat);
            pipeBody.rotation.z = Math.PI / 2;
            pipeBody.rotation.y = 0.35;
            pipeBody.castShadow = true;
            pipeBody.receiveShadow = true;
            pipeGroup.add(pipeBody);

            // 파이프 안쪽 어두운 구멍
            const pipeHole = new THREE.Mesh(
                new THREE.CircleGeometry(2.35, 24),
                new THREE.MeshBasicMaterial({ color: 0x141210 })
            );
            pipeHole.position.set(2.55, 0, -0.95);
            pipeHole.rotation.y = Math.PI / 2 + 0.35;
            pipeGroup.add(pipeHole);

            pipeGroup.position.set(-11.5, 2.3, -6.5);
            scene.add(pipeGroup);
            obstacles.push({ x: -11.5, z: -6.5, r: 3.2, h: 4.5 });

            // 2. 벽에 기댄 둥근 통조림 뚜껑 (배경 이미지 배관 옆)
            const lidMat = new THREE.MeshStandardMaterial({ color: 0x44403c, metalness: 0.7, roughness: 0.4 });
            const tinLid = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 0.22, 32), lidMat);
            tinLid.position.set(-7.5, 2.0, -9.2);
            tinLid.rotation.x = Math.PI / 2 - 0.25;
            tinLid.rotation.z = 0.2;
            tinLid.castShadow = true;
            scene.add(tinLid);
            obstacles.push({ x: -7.5, z: -9.2, r: 2.2, h: 3.5 });

            // 3. 천장에서 늘어진 전선 + 보라색 전구 & 초록색 전구 (배경 이미지 중앙 좌측 포인트!)
            const wireGroup = new THREE.Group();
            const wireMat = new THREE.MeshStandardMaterial({ color: 0x292524, roughness: 0.7 });
            const wirePole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 9.5, 12), wireMat);
            wirePole.position.y = 6.5;
            wireGroup.add(wirePole);

        // --- 3D 캐릭터 생성: 레드(플레이어) & 옐로우(동료) ---
        function createLarvaCharacter(isYellow) {
            const group = new THREE.Group();

            // 몸통 텍스처 (줄무늬)
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 256;
            const ctx = c.getContext('2d');
            if (isYellow) {
                ctx.fillStyle = '#facc15';
                ctx.fillRect(0, 0, 128, 256);
                ctx.fillStyle = '#ea580c';
                ctx.fillRect(0, 165, 128, 24);
                ctx.fillRect(0, 205, 128, 24);
            } else {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(0, 0, 128, 256);
                ctx.fillStyle = '#f97316';
                ctx.fillRect(0, 160, 128, 35);
                ctx.fillStyle = '#7f1d1d';
                ctx.fillRect(0, 210, 128, 30);
            }
            const bodyTex = new THREE.CanvasTexture(c);

            const radius = isYellow ? 0.62 : 0.52;
            const height = isYellow ? 1.55 : 1.15;

            // 메인 몸통 (캡슐 형태)
            const bodyMat = new THREE.MeshStandardMaterial({ map: bodyTex, roughness: 0.35 });
            const bodyGeo = new THREE.CylinderGeometry(radius * 0.88, radius, height, 20);
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = height * 0.5 + 0.2;
            bodyMesh.castShadow = true;
            group.add(bodyMesh);

            // 머리 돔
            const headMesh = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.88, 20, 16), bodyMat);
            headMesh.position.y = height + 0.2;
            headMesh.castShadow = true;
            group.add(headMesh);

            // 꼬리 곡선 부분
            const tailMesh = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.85, 16, 16), bodyMat);
            tailMesh.position.set(0, radius * 0.75, -radius * 0.75);
            tailMesh.scale.set(0.9, 0.85, 1.3);
            tailMesh.castShadow = true;
            group.add(tailMesh);

            // 왕눈이 한 쌍
            const eyeGeo = new THREE.SphereGeometry(isYellow ? 0.23 : 0.21, 16, 16);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const pupilGeo = new THREE.SphereGeometry(0.09, 12, 12);
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

            const eyeY = height + 0.22;
            const eyeZ = radius * 0.78;
            const eyeX = radius * 0.38;

            [-1, 1].forEach(side => {
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(side * eyeX, eyeY, eyeZ);
                group.add(eye);

                const pupil = new THREE.Mesh(pupilGeo, pupilMat);
                pupil.position.set(side * eyeX, eyeY, eyeZ + 0.17);
                group.add(pupil);

                if (isYellow) yellowPupils.push(pupil);
                else redPupils.push(pupil);
            });

            // 더듬이 (레드: 3가닥 뾰족 머리 / 옐로우: 구슬 더듬이)
            const antMat = new THREE.MeshStandardMaterial({ color: isYellow ? 0xf97316 : 0xdc2626 });
            if (isYellow) {
                const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.45, 8), antMat);
                stalk.position.set(0.25, height + 0.75, -0.05);
                stalk.rotation.z = -0.35;
                group.add(stalk);

                const ball = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), antMat);
                ball.position.set(0.35, height + 0.95, -0.05);
                group.add(ball);
            } else {
                [-0.12, 0, 0.12].forEach((offset, idx) => {
                    const hair = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.38, 8), antMat);
                    hair.position.set(offset, height + 0.72, 0);
                    hair.rotation.z = -offset * 1.5;
                    group.add(hair);
                });
            }

            // 입 (웃는/벌린 입)
            const mouthMesh = new THREE.Mesh(
                new THREE.BoxGeometry(radius * 0.9, isYellow ? 0.32 : 0.2, 0.15),
                new THREE.MeshBasicMaterial({ color: isYellow ? 0x7f1d1d : 0xffffff })
            );
            mouthMesh.position.set(0, height - 0.15, radius * 0.85);
            group.add(mouthMesh);

            return group;
        }

        // --- 3D 거대 보라색 벌레: 바이올렛(Violet) 생성 ---

        // --- 3D 칼집 소시지 생성 (4번째 첨부 이미지의 칼집 소시지 재현) ---
        function createScoredSausage(x, y, z) {
            const group = new THREE.Group();

            // 소시지 몸통 (노릇노릇하게 구워진 주황-갈색)
            const sausageMat = new THREE.MeshStandardMaterial({
                color: 0xd96b27,
                emissive: 0x7c2d12,
                emissiveIntensity: 0.25,
                roughness: 0.35
            });

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.95, 20), sausageMat);
            body.rotation.z = Math.PI / 2;
            body.castShadow = true;
            group.add(body);

            // 양쪽 둥근 끝부분
            [-0.47, 0.47].forEach(endX => {
                const cap = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), sausageMat);
                cap.position.x = endX;
                cap.castShadow = true;
                group.add(cap);
            });

            // 소시지 꼭지 (양 끝 매듭)
            [-0.81, 0.81].forEach(tipX => {
                const tip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), sausageMat);
                tip.position.x = tipX;
                group.add(tip);
            });

            // 4번째 이미지처럼 3줄의 깊은 칼집(Grill Score Marks) 추가!
            const cutMat = new THREE.MeshBasicMaterial({ color: 0x5c240c });
            [-0.22, 0, 0.22].forEach(cutX => {
                const cutRing = new THREE.Mesh(new THREE.TorusGeometry(0.315, 0.035, 8, 20, Math.PI * 1.1), cutMat);
                cutRing.position.x = cutX;
                cutRing.rotation.y = Math.PI / 2;
                cutRing.rotation.x = -0.2;
                group.add(cutRing);
            });

            // 은은한 황금빛 아우라 링 (숨겨진 소시지 발견 힌트)
            const glowRing = new THREE.Mesh(
                new THREE.RingGeometry(0.55, 0.85, 24),
                new THREE.MeshBasicMaterial({ color: 0xfef08a, side: THREE.DoubleSide, transparent: true, opacity: 0.75 })
            );
            glowRing.rotation.x = -Math.PI / 2;
            glowRing.position.y = -0.35;
            group.add(glowRing);

            group.position.set(x, y, z);
            // 어지럽게 굴러떨어진 느낌을 주도록 기울기와 방향을 제멋대로 설정
            group.rotation.set(
                (Math.random() - 0.5) * 0.65,
                Math.random() * Math.PI * 2,
                (Math.random() - 0.5) * 0.65
            );
            scene.add(group);
            return {
                mesh: group,
                baseY: y,
                collected: false,
                phase: Math.random() * Math.PI * 2,
                rotSpeedX: (Math.random() - 0.5) * 1.4,
                rotSpeedY: (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random() * 1.5)
            };
        }

        // --- 잘 보이는 소시지 7개를 어지럽게 흩어 배치 ---
        function spawnAllSausages() {
            // 기존 소시지 제거
            sausages.forEach(s => scene.remove(s.mesh));
            sausages = [];

            // 하수구 주변 잘 보이는 곳에 불규칙하게 어지럽게 흩어진 7개 위치
            const positions = [
                { x: -8.2, y: 0.75, z: -2.1 },   // 1. 왼쪽 파이프 앞쪽
                { x: -3.8, y: 0.75, z: -7.4 },   // 2. 전구 뒤쪽 바닥
                { x: -0.9, y: 0.75, z: -1.6 },   // 3. 중앙에 툭 떨어진 소시지
                { x: 4.3, y: 0.75, z: -5.9 },    // 4. 오른쪽 뒤편 바닥
                { x: 7.9, y: 0.75, z: -0.8 },    // 5. 오른쪽 중앙 근처
                { x: 3.1, y: 0.75, z: 7.6 },     // 6. 앞쪽 오른쪽 구석
                { x: -6.1, y: 0.75, z: 2.4 }     // 7. 왼쪽 이끼 앞쪽
            ];

            positions.forEach(p => {
                // 매번 조금씩 더 어지럽게 위치가 흐트러지도록 오프셋 추가
                const jitterX = p.x + (Math.random() - 0.5) * 1.3;
                const jitterZ = p.z + (Math.random() - 0.5) * 1.3;
                sausages.push(createScoredSausage(jitterX, p.y, jitterZ));
            });
        }

        // --- 게임 초기화 및 리셋 ---
        function resetGame() {
            lives = MAX_LIVES;
            collectedCount = 0;
            invulnerableTimer = 0;
            biteAnimTimer = 0;
            sausageCountEl.textContent = '0';
            renderLeafLives();

            playerPos.set(0, 0, 5.5);
            playerVelY = 0;
            isGrounded = true;
            playerYaw = Math.PI;

            yellowPos.set(-1.4, 0, 6.4);
            yellowYaw = Math.PI;

            // 바이올렛: 게임 중 단 한 번만 등장하여 계속 추적하도록 초기화
            violetState.phase = 'WARNING';
            violetState.timer = 1.6;
            violetState.biteCooldown = 0;
            violetState.pos.set(0, -6.2, -9.5);
            violetGroup.visible = true;
            violetGroup.rotation.set(0, 0, 0);
            violetGroup.position.copy(violetState.pos);
            warningBanner.classList.remove('hidden');
            playSound('warning');

            spawnAllSausages();
            isPlaying = true;
            overlayModal.classList.add('hidden');
        }

        // --- 물림(피격) 처리 ---
        function triggerBiteDamage(bittenPos) {
            if (invulnerableTimer > 0 || !isPlaying) return;
            lives = Math.max(0, lives - 1);
            invulnerableTimer = 1.8;
            biteAnimTimer = 0.45; // 바이올렛 턱 앙! 물기 모션
            violetState.biteCooldown = 1.2;
            renderLeafLives();
            playSound('hit');

            // 화면 붉은 점멸
            damageOverlay.classList.remove('damage-flash');
            void damageOverlay.offsetWidth;
            damageOverlay.classList.add('damage-flash');

            // 넉백 (레드와 옐로우가 함께 놀라서 뒤로 튕겨 나감)
            const pushDir = new THREE.Vector3().subVectors(bittenPos, violetState.pos).setY(0).normalize();
            if (pushDir.lengthSq() === 0) pushDir.set(0, 0, 1);
            playerPos.addScaledVector(pushDir, 2.8);
            yellowPos.addScaledVector(pushDir, 2.5);
            playerVelY = 6.8;
            isGrounded = false;

            if (lives <= 0) {
                endGame(false);
            } else {
                // 한 번 물리면 바이올렛도 초기 위치로 돌아가 다시 탄생(등장)
                setTimeout(() => {
                    if (!isPlaying) return;
                    violetState.phase = 'WARNING';
                    violetState.timer = 1.6;
                    violetState.biteCooldown = 0;
                    violetState.pos.set(0, -6.2, -9.5);
                    violetGroup.rotation.set(0, 0, 0);
                    violetGroup.position.copy(violetState.pos);
                    warningBanner.classList.remove('hidden');
                    playSound('warning');
                }, 450);
            }
        }

        // --- 게임 종료 (성공 또는 실패) ---
        function endGame(isWin) {
            isPlaying = false;
            warningBanner.classList.add('hidden');
            overlayModal.classList.remove('hidden');

            if (isWin) {
                playSound('win');
                modalBadge.textContent = '🌭👑 MISSION CLEAR!';
                modalBadge.className = 'inline-block bg-emerald-600 text-yellow-300 px-4 py-1 rounded-full text-sm cartoon-box mb-3';
                modalTitle.textContent = '칼집 소시지 7개 모두 획득!';
                modalDesc.innerHTML = `우와아! <b>레드와 옐로우</b>가 쫓아오는 바이올렛을 따돌리고 하수구에 흩어진 소시지 7개를 모두 차지했습니다! 배부르게 만찬을 즐겨요! 😋`;
                startBtn.textContent = '🔄 한 번 더 소시지 찾기!';
            } else {

                modalBadge.className = 'inline-block bg-purple-700 text-yellow-300 px-4 py-1 rounded-full text-sm cartoon-box mb-3';
                modalTitle.textContent = '바이올렛에게 3번 물렸어요!';
                modalDesc.innerHTML = `나뭇잎 기회 3번을 모두 써버렸어요! (찾은 소시지: <b>${collectedCount} / 7개</b>)<br>끈질기게 쫓아오는 바이올렛을 피해 다시 도전해볼까요?`;
                startBtn.textContent = '🔥 다시 시작하기!';
            }
        }

        // --- 바이올렛(보라색 적) AI 업데이트: 1회 등장 후 0.7배속으로 계속 추적 ---
        function updateViolet(dt) {
            const warnRing = violetGroup.getObjectByName('warnRing');
            const mouthGroup = violetGroup.getObjectByName('violetMouth');

            if (violetState.biteCooldown > 0) {
                violetState.biteCooldown -= dt;
            }
            if (biteAnimTimer > 0) {
                biteAnimTimer -= dt;
                if (mouthGroup) {
                    const chomp = 1 + Math.sin(biteAnimTimer * 28) * 0.45;
                    mouthGroup.scale.set(chomp, chomp, chomp);
                }
            } else if (mouthGroup) {
                mouthGroup.scale.set(1, 1, 1);
            }

            if (violetState.phase === 'WARNING') {
                // 땅 위 경고 링과 함께 부르르 떨리며 1회 등장 준비
                violetState.timer -= dt;
                violetGroup.position.y = -5.8 + Math.sin(violetState.timer * 45) * 0.15;
                if (warnRing) {
                    warnRing.visible = true;
                    warnRing.position.y = -violetGroup.position.y + 0.08;
                    const s = 1 + Math.sin(violetState.timer * 20) * 0.25;
                    warnRing.scale.set(s, s, 1);
                }
                if (violetState.timer <= 0) {
                    violetState.phase = 'EMERGE';
                    violetState.timer = 0.55;
                    playSound('roar');
                }
            } else if (violetState.phase === 'EMERGE') {
                // 땅속에서 거대하게 솟구쳐 오름
                violetState.timer -= dt;
                const progress = 1 - Math.max(0, violetState.timer / 0.55);
                violetGroup.position.y = THREE.MathUtils.lerp(-5.8, 0, progress);
                violetState.pos.y = violetGroup.position.y;
                if (warnRing) warnRing.position.y = -violetGroup.position.y + 0.08;

                const dx = playerPos.x - violetGroup.position.x;
                const dz = playerPos.z - violetGroup.position.z;
                violetGroup.rotation.y = Math.atan2(dx, dz);

                if (violetState.timer <= 0) {
                    violetState.phase = 'CHASE';
                    violetState.pos.y = 0;
                    violetGroup.position.y = 0;
                    if (warnRing) warnRing.visible = false;
                    // 2.5초 뒤 경고 배너 자동 숨김
                    setTimeout(() => warningBanner.classList.add('hidden'), 2500);
                }
            } else if (violetState.phase === 'CHASE') {
                // 더 이상 숨지 않고 0.7배속(5.2 * 0.7 = 3.64)으로 레드/옐로우 중 더 가까운 대상을 계속 추적!
                const distToRed = Math.hypot(playerPos.x - violetState.pos.x, playerPos.z - violetState.pos.z);
                const distToYellow = Math.hypot(yellowPos.x - violetState.pos.x, yellowPos.z - violetState.pos.z);

                const targetVec = distToYellow < distToRed ? yellowPos : playerPos;
                const dir = new THREE.Vector3().subVectors(targetVec, violetState.pos).setY(0);
                const dist = dir.length();

                if (dist > 0.1 && violetState.biteCooldown <= 0) {
                    dir.normalize();
                    const slowSpeed = 5.2 * 0.7; // 기존 대비 0.7배속
                    violetState.pos.addScaledVector(dir, slowSpeed * dt);
                    violetGroup.position.x = violetState.pos.x;
                    violetGroup.position.z = violetState.pos.z;

                    // 부드러운 방향 전환
                    const targetYaw = Math.atan2(dir.x, dir.z);
                    let diff = targetYaw - violetGroup.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    violetGroup.rotation.y += diff * 6 * dt;
                }

                // 0.7배속 묵직한 뒤뚱뒤뚱 추적 애니메이션
                const t = performance.now() * 0.006;
                violetGroup.position.y = Math.abs(Math.sin(t)) * 0.18;
                violetGroup.rotation.z = Math.cos(t) * 0.09;
                violetGroup.rotation.x = 0.12 + Math.sin(t * 2) * 0.08;

                // 물기 판정: 레드 또는 옐로우에게 바짝 다가가면 앙! 하고 물림
                const hitRed = distToRed < 1.85 && playerPos.y < 2.0;
                const hitYellow = distToYellow < 1.75;

                if (hitRed || hitYellow) {
                    triggerBiteDamage(hitRed ? playerPos : yellowPos);
                }
            }
        }

        // --- 메인 프레임 업데이트 ---
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            // 전구 은은한 깜빡임
            bulbLights.forEach((light, i) => {
                light.intensity = 1.4 + Math.sin(now * 0.004 + i * 2) * 0.35;
            });

            if (isPlaying) {
                // 무적 깜빡임 타이머 (레드와 옐로우 함께 깜빡임)
                if (invulnerableTimer > 0) {
                    invulnerableTimer -= dt;
                    const blink = Math.floor(invulnerableTimer * 16) % 2 === 0;
                    redGroup.visible = blink;
                    yellowGroup.visible = blink;
                } else {
                    redGroup.visible = true;
                    yellowGroup.visible = true;
                }

                // 1. 플레이어(레드) 이동 처리 (카메라 시점 기준)
                let moveForward = (keys.w || keys.up ? 1 : 0) - (keys.s || keys.down ? 1 : 0) - joyVec.y;
                let moveRight = (keys.d || keys.right ? 1 : 0) - (keys.a || keys.left ? 1 : 0) + joyVec.x;

                const moveVec = new THREE.Vector3(moveRight, 0, -moveForward);
                if (moveVec.lengthSq() > 0.001) {
                    moveVec.normalize();
                    // 카메라 Y축 회전각(camAngleX) 반영
                    moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), camAngleX);

                    const speed = 7.2;
                    const nextX = playerPos.x + moveVec.x * speed * dt;
                    const nextZ = playerPos.z + moveVec.z * speed * dt;

                    // 장애물 충돌 체크 (높이보다 낮으면 우회)
                    let blocked = false;
                    for (const obs of obstacles) {
                        const d = Math.hypot(nextX - obs.x, nextZ - obs.z);
                        if (d < obs.r + 0.55 && playerPos.y < obs.h * 0.85) {
                            blocked = true;
                            break;
                        }
                    }

                    // 하수구 원형 벽 경계 제한 (반지름 18.5 이내)
                    if (!blocked && Math.hypot(nextX, nextZ) < 18.5) {
                        playerPos.x = nextX;
                        playerPos.z = nextZ;
                    }

                    // 이동 방향으로 부드럽게 회전
                    const targetYaw = Math.atan2(moveVec.x, moveVec.z);
                    let diff = targetYaw - playerYaw;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    playerYaw += diff * 12 * dt;

                    // 꿍실꿍실 애벌레 이동 바운스
                    redGroup.rotation.z = Math.sin(now * 0.018) * 0.12;
                } else {
                    redGroup.rotation.z *= 0.85;
                }

                // 중력 및 점프 처리
                playerVelY -= 22 * dt;
                playerPos.y += playerVelY * dt;
                if (playerPos.y <= 0) {
                    playerPos.y = 0;
                    playerVelY = 0;
                    isGrounded = true;
                }

                redGroup.position.copy(playerPos);
                redGroup.rotation.y = playerYaw;

                // 2. 동료 옐로우 AI (레드를 귀엽게 따라다님)
                const toRed = new THREE.Vector3().subVectors(playerPos, yellowPos);
                toRed.y = 0;
                const distToRed = toRed.length();
                if (distToRed > 1.75) {
                    toRed.normalize();
                    yellowPos.addScaledVector(toRed, Math.min(6.4 * dt, distToRed - 1.6));
                    yellowYaw = Math.atan2(toRed.x, toRed.z);
                    yellowGroup.position.y = Math.abs(Math.sin(now * 0.015)) * 0.25;
                    yellowGroup.rotation.z = Math.cos(now * 0.015) * 0.14;
                } else {
                    yellowGroup.position.y *= 0.8;
                    yellowGroup.rotation.z *= 0.8;
                }
                yellowGroup.position.x = yellowPos.x;
                yellowGroup.position.z = yellowPos.z;
                yellowGroup.rotation.y = yellowYaw;
                // 3. 어지럽게 흩어진 소시지 7개 회전 및 획득 체크
                sausages.forEach(s => {
                    if (s.collected) return;
                    s.mesh.rotation.y += s.rotSpeedY * dt;
                    s.mesh.rotation.x += s.rotSpeedX * dt;
                    s.mesh.position.y = s.baseY + Math.sin(now * 0.004 + s.phase) * 0.16;

                    const distRed = Math.hypot(playerPos.x - s.mesh.position.x, playerPos.z - s.mesh.position.z);
                    const distYellow = Math.hypot(yellowPos.x - s.mesh.position.x, yellowPos.z - s.mesh.position.z);

                    if (distRed < 1.35 || distYellow < 1.35) {
                        s.collected = true;
                        s.mesh.visible = false;
                        collectedCount++;
                        sausageCountEl.textContent = collectedCount.toString();
                        playSound('sausage');

                        if (collectedCount >= TOTAL_SAUSAGES) {
                            endGame(true);
                        }
                    }
                });

                // 4. 바이올렛 적 업데이트
                updateViolet(dt);
            }

            // 5. 3인칭 카메라 추적 (마우스 드래그 회전 반영)
            const camDist = 9.5;
            const camX = playerPos.x + Math.sin(camAngleX) * Math.cos(camAngleY) * camDist;
            const camY = Math.max(1.5, playerPos.y + Math.sin(camAngleY) * camDist + 1.5);
            const camZ = playerPos.z + Math.cos(camAngleX) * Math.cos(camAngleY) * camDist;

            camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.14);
            camera.lookAt(playerPos.x, playerPos.y + 1.1, playerPos.z);

            renderer.render(scene, camera);
        }

        // --- 점프 실행 ---
        function doJump() {
            if (!isPlaying || !isGrounded) return;
            playerVelY = 9.8;
            isGrounded = false;
            playSound('jump');
        }

        // --- 이벤트 리스너 등록 ---
        function setupControls() {
            // 키보드 입력
            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = true;
                if (k === 'a') keys.a = true;
                if (k === 's') keys.s = true;
                if (k === 'd') keys.d = true;
                if (e.key === 'ArrowUp') keys.up = true;
                if (e.key === 'ArrowDown') keys.down = true;
                if (e.key === 'ArrowLeft') keys.left = true;
                if (e.key === 'ArrowRight') keys.right = true;
                if (e.code === 'Space') {
                    e.preventDefault();
                    doJump();
                }
            });

            window.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = false;
                if (k === 'a') keys.a = false;
                if (k === 's') keys.s = false;
                if (k === 'd') keys.d = false;
                if (e.key === 'ArrowUp') keys.up = false;
                if (e.key === 'ArrowDown') keys.down = false;
                if (e.key === 'ArrowLeft') keys.left = false;
                if (e.key === 'ArrowRight') keys.right = false;
            });

            // 마우스 드래그로 카메라 각도 변경
            canvas.addEventListener('mousedown', e => {
                isDraggingCam = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            });
            window.addEventListener('mousemove', e => {
                if (!isDraggingCam) return;
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;

                camAngleX -= dx * 0.007;
                camAngleY = THREE.MathUtils.clamp(camAngleY + dy * 0.006, 0.12, 1.15);
            });
            window.addEventListener('mouseup', () => {
                isDraggingCam = false;
            });

            // 모바일 가상 조이스틱
            const joystickZone = document.getElementById('joystickZone');
            const joystickKnob = document.getElementById('joystickKnob');
            let joyTouchId = null;

            joystickZone.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.changedTouches[0];
                joyTouchId = t.identifier;
                updateJoystick(t.clientX, t.clientY);
            }, { passive: false });

            joystickZone.addEventListener('touchmove', e => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joyTouchId) {
                        updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                    }
                }
            }, { passive: false });

            const resetJoystick = () => {
                joyTouchId = null;
                joyVec = { x: 0, y: 0 };
                joystickKnob.style.transform = 'translate(0px, 0px)';
            };
            joystickZone.addEventListener('touchend', resetJoystick);
            joystickZone.addEventListener('touchcancel', resetJoystick);

            function updateJoystick(cx, cy) {
                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const maxR = rect.width * 0.35;

                let dx = cx - centerX;
                let dy = cy - centerY;
                const dist = Math.hypot(dx, dy);
                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }
                joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyVec = { x: dx / maxR, y: dy / maxR };
            }

            // 모바일 점프 버튼
            document.getElementById('mobileJumpBtn').addEventListener('touchstart', e => {
                e.preventDefault();
                doJump();
            }, { passive: false });

            // 시작 버튼
            startBtn.addEventListener('click', resetGame);

            // 사운드 토글
            document.getElementById('soundToggle').addEventListener('click', () => {
                isMuted = !isMuted;
                document.getElementById('soundIcon').textContent = isMuted ? '🔇' : '🔊';
                document.getElementById('soundText').textContent = isMuted ? '소리 꺼짐' : '효과음 ON';
            });

            // 화면 리사이즈 대응
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- window.onload에서 3D 씬 초기화 및 애니메이션 루프 시작 ---
        window.onload = function () {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x3a3222, 0.024);

            camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // 조명 세팅 (하수구 위쪽에서 비추는 따뜻한 햇빛 + 은은한 환경광)
            const hemiLight = new THREE.HemisphereLight(0xfef08a, 0x3f321d, 0.85);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.05);
            dirLight.position.set(6, 18, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 45;
            const d = 18;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // 월드 및 캐릭터 생성
            buildSewerEnvironment();

            redGroup = createLarvaCharacter(false);
            redGroup.position.copy(playerPos);
            scene.add(redGroup);

            yellowGroup = createLarvaCharacter(true);
            yellowGroup.position.copy(yellowPos);
            scene.add(yellowGroup);

            violetGroup = createVioletEnemy();
            scene.add(violetGroup);

            spawnAllSausages();
            renderLeafLives();
            setupControls();

            // 애니메이션 루프 시작
            animate(performance.now());
        };
    </script>
</body>
