<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>파스텔 핑크 블록 블라스트</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js (효과음 생성용) 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts: Inter 및 고정폭 숫자용 JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e6 50%, #fbcfe8 100%);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            overflow: hidden;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
        .btn-push {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-push:active {
            transform: translateY(3px);
        }
        @keyframes popFloat {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }
        .score-popup {
            animation: popFloat 0.85s ease-out forwards;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen text-pink-950 flex flex-col items-center justify-center p-3 sm:p-5">

    <!-- 메인 게임 컨테이너 -->
    <div class="w-full max-w-md bg-white/90 backdrop-blur-xl border-2 border-pink-200 rounded-3xl shadow-2xl shadow-pink-300/50 p-4 sm:p-6 flex flex-col gap-4 relative">
        
        <!-- 상단 헤더 & 점수판 -->
        <div class="flex items-center justify-between border-b border-pink-100 pb-3">
            <div>
                <span class="inline-block px-2 py-0.5 bg-pink-100 text-pink-600 text-[10px] font-extrabold rounded-full mb-0.5">PUZZLE BLAST</span>
                <h1 class="text-xl sm:text-2xl font-black tracking-tight text-pink-950">블록 블라스트</h1>
            </div>

            <div class="flex items-center gap-2">
                <!-- 현재 점수 -->
                <div class="bg-pink-50 border border-pink-200 rounded-2xl px-3 py-1.5 text-center min-w-[72px]">
                    <span class="block text-[9px] font-extrabold text-pink-400">SCORE</span>
                    <span id="scoreDisplay" class="font-mono-num text-base sm:text-lg font-black text-pink-950">0</span>
                </div>
                <!-- 최고 점수 -->
                <div class="bg-pink-50 border border-pink-200 rounded-2xl px-3 py-1.5 text-center min-w-[72px]">
                    <span class="block text-[9px] font-extrabold text-pink-400">BEST</span>
                    <span id="bestDisplay" class="font-mono-num text-base sm:text-lg font-black text-pink-600">0</span>
                </div>
                <!-- 사운드 토글 -->
                <button id="soundToggleBtn" class="p-2.5 rounded-2xl bg-pink-100 hover:bg-pink-200 text-pink-600 transition" title="효과음 켜기/끄기">
                    <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                    </svg>
                    <svg id="soundOffIcon" class="w-5 h-5 hidden text-pink-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 8x8 메인 게임 보드 캔버스 영역 -->
        <div id="boardContainer" class="relative flex items-center justify-center bg-pink-50 border-2 border-pink-200 rounded-2xl p-2 shadow-inner">
            <canvas id="gameCanvas" class="block rounded-xl cursor-grab active:cursor-grabbing"></canvas>
            
            <!-- 콤보 & 점수 팝업 레이어 -->
            <div id="popupLayer" class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden"></div>

            <!-- 게임 오버 오버레이 -->
            <div id="gameOverOverlay" class="hidden absolute inset-0 bg-white/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-5 text-center z-20">
                <span class="text-4xl mb-2">🌸</span>
                <h2 class="text-2xl font-black text-pink-600 mb-1">더 이상 놓을 곳이 없어요!</h2>
                <p id="finalScoreText" class="text-sm font-bold text-pink-900 mb-5">최종 점수: 0점</p>
                <button id="restartBtn" class="btn-push px-7 py-3.5 rounded-2xl font-black text-base text-white bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-400 hover:to-rose-300 shadow-lg shadow-pink-300 border-b-4 border-pink-600 cursor-pointer">
                    다시 시작하기
                </button>
            </div>
        </div>

        <!-- 하단 3개 블록 대기 트레이 -->
        <div class="bg-pink-50/90 border-2 border-pink-200 rounded-2xl p-3">
            <div class="flex justify-between items-center mb-1.5 px-1">
                <span class="text-[11px] font-extrabold text-pink-500">블록을 드래그해서 보드에 올려놓으세요</span>
                <span id="comboBadge" class="hidden px-2 py-0.5 bg-rose-500 text-white text-[10px] font-black rounded-full">COMBO x2</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div id="slot0" class="aspect-square bg-white rounded-xl border border-pink-100 flex items-center justify-center relative cursor-grab active:cursor-grabbing">
                    <canvas id="trayCanvas0"></canvas>
                </div>
                <div id="slot1" class="aspect-square bg-white rounded-xl border border-pink-100 flex items-center justify-center relative cursor-grab active:cursor-grabbing">
                    <canvas id="trayCanvas1"></canvas>
                </div>
                <div id="slot2" class="aspect-square bg-white rounded-xl border border-pink-100 flex items-center justify-center relative cursor-grab active:cursor-grabbing">
                    <canvas id="trayCanvas2"></canvas>
                </div>
            </div>
        </div>

    </div>

    <!-- 드래그 중인 블록을 화면 전체에 자유롭게 그리기 위한 플로팅 캔버스 -->
    <canvas id="dragCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <script>
        /**
         * 파스텔 핑크 블록 블라스트 게임 엔진
         */
        class PinkBlockBlast {
            constructor() {
                this.GRID_SIZE = 8;

                // 파스텔 캔디 컬러 팔레트
                this.PALETTE = [
                    null,
                    '#f472b6', // 1: 브라이트 핑크
                    '#fb7185', // 2: 로즈 코랄
                    '#c084fc', // 3: 라벤더 퍼플
                    '#38bdf8', // 4: 스카이 민트
                    '#fbbf24', // 5: 파스텔 앰버
                    '#34d399', // 6: 민트 에메랄드
                    '#e879f9'  // 7: 마젠타 오키드
                ];

                // 다양한 블록 도형 정의
                this.SHAPES = [
                    [[1]],                                       // 1x1 점
                    [[1, 1]],                                    // 1x2 가로
                    [[1], [1]],                                  // 2x1 세로
                    [[1, 1, 1]],                                 // 1x3 가로
                    [[1], [1], [1]],                             // 3x1 세로
                    [[1, 1, 1, 1]],                              // 1x4 가로
                    [[1], [1], [1], [1]],                        // 4x1 세로
                    [[1, 1, 1, 1, 1]],                           // 1x5 가로
                    [[1], [1], [1], [1], [1]],                   // 5x1 세로
                    [[1, 1], [1, 1]],                            // 2x2 정사각형
                    [[1, 1, 1], [1, 1, 1], [1, 1, 1]],           // 3x3 큰 정사각형
                    [[1, 0], [1, 1]],                            // 작은 ㄴ자
                    [[0, 1], [1, 1]],                            // 작은 역ㄴ자
                    [[1, 1], [1, 0]],                            // 작은 ㄱ자
                    [[1, 1], [0, 1]],                            // 작은 역ㄱ자
                    [[1, 0, 0], [1, 0, 0], [1, 1, 1]],           // 큰 ㄴ자
                    [[0, 0, 1], [0, 0, 1], [1, 1, 1]],           // 큰 역ㄴ자
                    [[1, 1, 1], [1, 0, 0], [1, 0, 0]],           // 큰 ㄱ자
                    [[1, 1, 1], [0, 0, 1], [0, 0, 1]],           // 큰 역ㄱ자
                    [[1, 1, 1], [0, 1, 0]],                      // T자
                    [[0, 1, 0], [1, 1, 1]],                      // ㅗ자
                    [[1, 1, 0], [0, 1, 1]],                      // Z자
                    [[0, 1, 1], [1, 1, 0]]                       // S자
                ];

                // DOM 바인딩
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.dragCanvas = document.getElementById('dragCanvas');
                this.dragCtx = this.dragCanvas.getContext('2d');

                this.trayCanvases = [
                    document.getElementById('trayCanvas0'),
                    document.getElementById('trayCanvas1'),
                    document.getElementById('trayCanvas2')
                ];
                this.trayCtxs = this.trayCanvases.map(c => c.getContext('2d'));
                this.slots = [
                    document.getElementById('slot0'),
                    document.getElementById('slot1'),
                    document.getElementById('slot2')
                ];

                this.scoreDisplay = document.getElementById('scoreDisplay');
                this.bestDisplay = document.getElementById('bestDisplay');
                this.comboBadge = document.getElementById('comboBadge');
                this.popupLayer = document.getElementById('popupLayer');
                this.gameOverOverlay = document.getElementById('gameOverOverlay');
                this.finalScoreText = document.getElementById('finalScoreText');
                this.restartBtn = document.getElementById('restartBtn');

                this.soundToggleBtn = document.getElementById('soundToggleBtn');
                this.soundOnIcon = document.getElementById('soundOnIcon');
                this.soundOffIcon = document.getElementById('soundOffIcon');

                // 게임 상태
                this.board = this.createEmptyBoard();
                this.trayPieces = [null, null, null];
                this.score = 0;
                this.bestScore = parseInt(localStorage.getItem('pinkBlockBlast_best') || '0', 10);
                this.combo = 0;
                this.soundEnabled = true;

                // 드래그 상태
                this.dragging = null; // { slotIndex, piece, clientX, clientY, targetRow, targetCol }
                this.clearingCells = []; // 터지는 애니메이션 중인 좌표 배열

                this.bestDisplay.textContent = this.bestScore.toLocaleString();
                this.resize();
                this.bindEvents();
                this.initGame();
            }

            createEmptyBoard() {
                return Array.from({ length: this.GRID_SIZE }, () => Array(this.GRID_SIZE).fill(0));
            }

            resize() {
                const container = document.getElementById('boardContainer');
                const maxBoardWidth = Math.min(container.clientWidth - 20, 360);
                this.cellSize = Math.floor(maxBoardWidth / this.GRID_SIZE);
                const boardPx = this.cellSize * this.GRID_SIZE;

                this.canvas.width = boardPx;
                this.canvas.height = boardPx;

                this.dragCanvas.width = window.innerWidth;
                this.dragCanvas.height = window.innerHeight;

                // 트레이 캔버스 크기 조정
                this.slots.forEach((slot, idx) => {
                    const size = Math.max(slot.clientWidth - 12, 64);
                    this.trayCanvases[idx].width = size;
                    this.trayCanvases[idx].height = size;
                });

                this.renderBoard();
                this.renderTray();
            }

            initGame() {
                this.board = this.createEmptyBoard();
                this.score = 0;
                this.combo = 0;
                this.clearingCells = [];
                this.updateScoreUI();
                this.comboBadge.classList.add('hidden');
                this.gameOverOverlay.classList.add('hidden');

                this.refillTray();
                this.renderBoard();
            }

            // 하단 3칸 트레이에 새 블록 채우기
            refillTray() {
                for (let i = 0; i < 3; i++) {
                    const shape = this.SHAPES[Math.floor(Math.random() * this.SHAPES.length)];
                    const colorId = Math.floor(Math.random() * 7) + 1;
                    this.trayPieces[i] = {
                        matrix: shape.map(row => row.map(v => (v ? colorId : 0))),
                        colorId
                    };
                }
                this.renderTray();
            }

            // 효과음 재생 (Tone.js)
            playSound(type) {
                if (!this.soundEnabled) return;
                try {
                    if (Tone.context.state !== 'running') {
                        Tone.start();
                    }
                    const synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'triangle' },
                        envelope: { attack: 0.01, decay: 0.12, sustain: 0.05, release: 0.15 }
                    }).toDestination();
                    synth.volume.value = -8;
                    const now = Tone.now();

                    if (type === 'pickup') {
                        synth.triggerAttackRelease('E5', '32n', now);
                    } else if (type === 'place') {
                        synth.triggerAttackRelease('C5', '16n', now);
                    } else if (type === 'clear') {
                        synth.triggerAttackRelease(['C5', 'E5', 'G5'], '16n', now);
                        synth.triggerAttackRelease(['E5', 'G5', 'C6'], '8n', now + 0.08);
                    } else if (type === 'gameover') {
                        synth.triggerAttackRelease('G4', '8n', now);
                        synth.triggerAttackRelease('Eb4', '8n', now + 0.16);
                        synth.triggerAttackRelease('C4', '4n', now + 0.32);
                    }
                } catch (e) {}
            }

            // 보드에 해당 블록을 놓을 수 있는지 검사
            canPlace(matrix, startRow, startCol) {
                for (let r = 0; r < matrix.length; r++) {
                    for (let c = 0; c < matrix[r].length; c++) {
                        if (matrix[r][c] !== 0) {
                            const br = startRow + r;
                            const bc = startCol + c;
                            if (
                                br < 0 ||
                                br >= this.GRID_SIZE ||
                                bc < 0 ||
                                bc >= this.GRID_SIZE ||
                                this.board[br][bc] !== 0
                            ) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            }

            // 남은 트레이 블록 중 하나라도 보드 어딘가에 놓을 수 있는지 확인
            hasAnyValidMove() {
                for (let i = 0; i < 3; i++) {
                    const piece = this.trayPieces[i];
                    if (!piece) continue;
                    for (let r = 0; r < this.GRID_SIZE; r++) {
                        for (let c = 0; c < this.GRID_SIZE; c++) {
                            if (this.canPlace(piece.matrix, r, c)) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            // 블록 보드에 배치 실행
            placePiece(slotIndex, startRow, startCol) {
                const piece = this.trayPieces[slotIndex];
                if (!piece || !this.canPlace(piece.matrix, startRow, startCol)) return false;

                let placedBlocks = 0;
                for (let r = 0; r < piece.matrix.length; r++) {
                    for (let c = 0; c < piece.matrix[r].length; c++) {
                        if (piece.matrix[r][c] !== 0) {
                            this.board[startRow + r][startCol + c] = piece.matrix[r][c];
                            placedBlocks++;
                        }
                    }
                }

                // 배치한 칸 수만큼 기본 점수 부여
                this.score += placedBlocks * 10;
                this.trayPieces[slotIndex] = null;
                this.playSound('place');

                // 가로/세로 완성된 줄 확인 및 제거
                this.checkAndClearLines();

                // 3개 모두 사용했으면 새로 리필
                if (this.trayPieces.every(p => p === null)) {
                    this.refillTray();
                } else {
                    this.renderTray();
                }

                this.updateScoreUI();
                this.renderBoard();

                // 더 이상 놓을 수 있는 블록이 없으면 게임 오버
                if (!this.hasAnyValidMove()) {
                    setTimeout(() => this.triggerGameOver(), 350);
                }

                return true;
            }

            // 완성된 가로줄 및 세로줄 동시 탐색 및 클리어
            checkAndClearLines() {
                const fullRows = [];
                const fullCols = [];

                for (let r = 0; r < this.GRID_SIZE; r++) {
                    if (this.board[r].every(cell => cell !== 0)) {
                        fullRows.push(r);
                    }
                }

                for (let c = 0; c < this.GRID_SIZE; c++) {
                    let isFull = true;
                    for (let r = 0; r < this.GRID_SIZE; r++) {
                        if (this.board[r][c] === 0) {
                            isFull = false;
                            break;
                        }
                    }
                    if (isFull) fullCols.push(c);
                }

                const totalLines = fullRows.length + fullCols.length;

                if (totalLines > 0) {
                    this.combo++;
                    this.playSound('clear');

                    // 터질 셀 좌표 수집
                    const toClear = new Set();
                    fullRows.forEach(r => {
                        for (let c = 0; c < this.GRID_SIZE; c++) toClear.add(`${r},${c}`);
                    });
                    fullCols.forEach(c => {
                        for (let r = 0; r < this.GRID_SIZE; r++) toClear.add(`${r},${c}`);
                    });

                    // 보드 비우기
                    toClear.forEach(key => {
                        const [r, c] = key.split(',').map(Number);
                        this.board[r][c] = 0;
                    });

                    // 보너스 점수 계산 (동시 클리어 + 연속 콤보)
                    const lineBonus = totalLines * 100 * totalLines;
                    const comboBonus = this.combo > 1 ? this.combo * 50 : 0;
                    const earned = lineBonus + comboBonus;
                    this.score += earned;

                    // 콤보 배지 및 팝업 표시
                    if (this.combo > 1) {
                        this.comboBadge.textContent = `COMBO x${this.combo}`;
                        this.comboBadge.classList.remove('hidden');
                    }
                    this.showScorePopup(`+${earned}${totalLines > 1 ? ` (${totalLines}줄!)` : ''}`);
                } else {
                    // 줄을 못 깨면 콤보 초기화
                    this.combo = 0;
                    this.comboBadge.classList.add('hidden');
                }
            }

            showScorePopup(text) {
                const el = document.createElement('div');
                el.className = 'score-popup font-mono-num font-black text-2xl text-pink-600 drop-shadow-sm bg-white/90 px-3 py-1 rounded-full border border-pink-200';
                el.textContent = text;
                this.popupLayer.appendChild(el);
                setTimeout(() => el.remove(), 850);
            }

            updateScoreUI() {
                this.scoreDisplay.textContent = this.score.toLocaleString();
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('pinkBlockBlast_best', this.bestScore.toString());
                }
                this.bestDisplay.textContent = this.bestScore.toLocaleString();
            }

            triggerGameOver() {
                this.playSound('gameover');
                this.finalScoreText.textContent = `최종 점수: ${this.score.toLocaleString()}점`;
                this.gameOverOverlay.classList.remove('hidden');
            }

            // 8x8 보드 렌더링
            renderBoard() {
                const cs = this.cellSize;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 빈 칸 격자 그리기
                for (let r = 0; r < this.GRID_SIZE; r++) {
                    for (let c = 0; c < this.GRID_SIZE; c++) {
                        const x = c * cs;
                        const y = r * cs;
                        const pad = 2;

                        this.ctx.fillStyle = '#fce7f3';
                        this.roundRect(this.ctx, x + pad, y + pad, cs - pad * 2, cs - pad * 2, 6, true, false);

                        const val = this.board[r][c];
                        if (val !== 0) {
                            this.drawCandyBlock(this.ctx, x + pad, y + pad, cs - pad * 2, this.PALETTE[val]);
                        }
                    }
                }

                // 드래그 중일 때 보드 위 착지 미리보기(고스트) 표시
                if (this.dragging && this.dragging.targetRow !== null && this.dragging.targetCol !== null) {
                    const { piece, targetRow, targetCol } = this.dragging;
                    if (this.canPlace(piece.matrix, targetRow, targetCol)) {
                        for (let r = 0; r < piece.matrix.length; r++) {
                            for (let c = 0; c < piece.matrix[r].length; c++) {
                                if (piece.matrix[r][c] !== 0) {
                                    const x = (targetCol + c) * cs + 2;
                                    const y = (targetRow + r) * cs + 2;
                                    this.ctx.fillStyle = this.PALETTE[piece.colorId] + '55'; // 반투명 프리뷰
                                    this.roundRect(this.ctx, x, y, cs - 4, cs - 4, 6, true, false);
                                }
                            }
                        }
                    }
                }
            }

            // 하단 트레이 3칸 렌더링
            renderTray() {
                for (let i = 0; i < 3; i++) {
                    const canvas = this.trayCanvases[i];
                    const ctx = this.trayCtxs[i];
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // 현재 드래그 중인 슬롯의 블록은 트레이에서 숨김
                    if (this.dragging && this.dragging.slotIndex === i) continue;

                    const piece = this.trayPieces[i];
                    if (!piece) continue;

                    const rows = piece.matrix.length;
                    const cols = piece.matrix[0].length;
                    const maxDim = Math.max(rows, cols, 3);
                    const miniSize = Math.floor((canvas.width - 8) / maxDim);

                    const offsetX = (canvas.width - cols * miniSize) / 2;
                    const offsetY = (canvas.height - rows * miniSize) / 2;

                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (piece.matrix[r][c] !== 0) {
                                this.drawCandyBlock(
                                    ctx,
                                    offsetX + c * miniSize + 1.5,
                                    offsetY + r * miniSize + 1.5,
                                    miniSize - 3,
                                    this.PALETTE[piece.colorId]
                                );
                            }
                        }
                    }
                }
            }

            // 드래그 중인 플로팅 블록 렌더링
            renderDragCanvas() {
                this.dragCtx.clearRect(0, 0, this.dragCanvas.width, this.dragCanvas.height);
                if (!this.dragging) return;

                const { piece, clientX, clientY } = this.dragging;
                const cs = this.cellSize;
                const rows = piece.matrix.length;
                const cols = piece.matrix[0].length;

                // 모바일에서 손가락에 가려지지 않도록 블록을 손가락 위쪽으로 살짝 띄워서 표시
                const liftOffsetY = cs * 1.6;
                const startX = clientX - (cols * cs) / 2;
                const startY = clientY - (rows * cs) / 2 - liftOffsetY;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (piece.matrix[r][c] !== 0) {
                            this.drawCandyBlock(
                                this.dragCtx,
                                startX + c * cs + 2,
                                startY + r * cs + 2,
                                cs - 4,
                                this.PALETTE[piece.colorId]
                            );
                        }
                    }
                }
            }

            // 입체감 있는 캔디 블록 그리기
            drawCandyBlock(ctx, x, y, size, color) {
                ctx.fillStyle = color;
                this.roundRect(ctx, x, y, size, size, 6, true, false);

                // 상단 하이라이트 광택
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                this.roundRect(ctx, x + 2, y + 2, size - 4, size * 0.35, 4, true, false);
            }

            roundRect(ctx, x, y, width, height, radius, fill, stroke) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                if (fill) ctx.fill();
                if (stroke) ctx.stroke();
            }

            // 드래그 시작/이동/종료 좌표 계산
            startDrag(slotIndex, clientX, clientY) {
                const piece = this.trayPieces[slotIndex];
                if (!piece) return;

                this.playSound('pickup');
                this.dragging = {
                    slotIndex,
                    piece,
                    clientX,
                    clientY,
                    targetRow: null,
                    targetCol: null
                };
                this.updateDragTarget(clientX, clientY);
                this.renderTray();
                this.renderBoard();
                this.renderDragCanvas();
            }

            updateDragTarget(clientX, clientY) {
                if (!this.dragging) return;
                this.dragging.clientX = clientX;
                this.dragging.clientY = clientY;

                const rect = this.canvas.getBoundingClientRect();
                const cs = this.cellSize;
                const rows = this.dragging.piece.matrix.length;
                const cols = this.dragging.piece.matrix[0].length;
                const liftOffsetY = cs * 1.6;

                // 블록 좌상단 기준 보드 좌표 계산
                const pieceLeft = clientX - (cols * cs) / 2;
                const pieceTop = clientY - (rows * cs) / 2 - liftOffsetY;

                const col = Math.round((pieceLeft - rect.left) / cs);
                const row = Math.round((pieceTop - rect.top) / cs);

                if (
                    row >= -1 &&
                    row <= this.GRID_SIZE &&
                    col >= -1 &&
                    col <= this.GRID_SIZE &&
                    this.canPlace(this.dragging.piece.matrix, row, col)
                ) {
                    this.dragging.targetRow = row;
                    this.dragging.targetCol = col;
                } else {
                    this.dragging.targetRow = null;
                    this.dragging.targetCol = null;
                }
            }

            endDrag() {
                if (!this.dragging) return;
                const { slotIndex, targetRow, targetCol } = this.dragging;
                this.dragging = null;
                this.dragCtx.clearRect(0, 0, this.dragCanvas.width, this.dragCanvas.height);

                if (targetRow !== null && targetCol !== null) {
                    this.placePiece(slotIndex, targetRow, targetCol);
                } else {
                    this.renderTray();
                    this.renderBoard();
                }
            }

            bindEvents() {
                window.addEventListener('resize', () => this.resize());

                this.restartBtn.addEventListener('click', () => this.initGame());

                this.soundToggleBtn.addEventListener('click', () => {
                    this.soundEnabled = !this.soundEnabled;
                    this.soundOnIcon.classList.toggle('hidden', !this.soundEnabled);
                    this.soundOffIcon.classList.toggle('hidden', this.soundEnabled);
                });

                // 3개 트레이 슬롯에 마우스 및 터치 드래그 이벤트 연결
                this.slots.forEach((slot, idx) => {
                    slot.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        this.startDrag(idx, e.clientX, e.clientY);
                    });

                    slot.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        this.startDrag(idx, touch.clientX, touch.clientY);
                    }, { passive: false });
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.dragging) return;
                    this.updateDragTarget(e.clientX, e.clientY);
                    this.renderBoard();
                    this.renderDragCanvas();
                });

                window.addEventListener('touchmove', (e) => {
                    if (!this.dragging) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.updateDragTarget(touch.clientX, touch.clientY);
                    this.renderBoard();
                    this.renderDragCanvas();
                }, { passive: false });

                window.addEventListener('mouseup', () => this.endDrag());
                window.addEventListener('touchend', () => this.endDrag());
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new PinkBlockBlast();
        });
    </script>
</body>
</html>
