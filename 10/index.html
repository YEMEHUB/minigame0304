<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사람 캐릭터 장애물 피하기 게임</title>
  <style>
    body {
      margin: 0;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    .container {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 24px;
    }

    p {
      color: #7f8c8d;
      font-size: 14px;
      margin-bottom: 20px;
    }

    canvas {
      background: linear-gradient(to bottom, #e0f7fa, #ffffff);
      border-radius: 12px;
      display: block;
      margin: 0 auto 20px auto;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 15px;
      padding: 0 10px;
    }

    .start-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
    }

    .start-btn:hover {
      background-color: #c0392b;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏃‍♂️ 사람 캐릭터 장애물 피하기 게임</h1>
  <p>스페이스바 또는 화면을 클릭하여 점프하세요!</p>

  <div class="info-bar">
    <div>점수: <span id="score">0</span></div>
    <div>최고 점수: <span id="highScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="600" height="220"></canvas>

  <button class="start-btn" id="startBtn" onclick="startGame()">게임 시작</button>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score');
  const highScoreDisplay = document.getElementById('highScore');
  const startBtn = document.getElementById('startBtn');

  // 게임 변수
  let score = 0;
  let highScore = 0;
  let isPlaying = false;
  let animationId = null;

  // 플레이어 객체 (사람 캐릭터)
  const player = {
    x: 60,
    y: 150,
    width: 35,
    height: 45,
    dy: 0,
    jumpPower: -11,
    gravity: 0.55,
    grounded: true,
    jump() {
      if (this.grounded) {
        this.dy = this.jumpPower;
        this.grounded = false;
      }
    },
    update() {
      this.dy += this.gravity;
      this.y += this.dy;

      // 바닥 충돌 체크
      const floorY = 185 - this.height;
      if (this.y >= floorY) {
        this.y = floorY;
        this.dy = 0;
        this.grounded = true;
      }
    },
    draw() {
      // 사람 모양 이모지나 느낌으로 입체감 표현
      ctx.font = '36px sans-serif';
      ctx.fillText('🏃‍♂️', this.x - 2, this.y + 36);
    }
  };

  // 장애물 배열
  let obstacles = [];
  let obstacleTimer = 0;
  let gameSpeed = 5;

  const obstacleEmojis = ['🍎', '🌵', '📦', '🍄'];

  function spawnObstacle() {
    const randomEmoji = obstacleEmojis[Math.floor(Math.random() * obstacleEmojis.length)];
    obstacles.push({
      x: canvas.width,
      y: 150,
      width: 35,
      height: 35,
      emoji: randomEmoji
    });
  }

  function resetGame() {
    score = 0;
    obstacles = [];
    obstacleTimer = 0;
    gameSpeed = 5;
    player.y = 140;
    player.dy = 0;
    player.grounded = true;
    scoreDisplay.textContent = score;
  }

  function startGame() {
    if (isPlaying) return;
    resetGame();
    isPlaying = true;
    startBtn.style.display = 'none';
    loop();
  }

  function gameOver() {
    isPlaying = false;
    cancelAnimationFrame(animationId);
    startBtn.style.display = 'inline-block';
    startBtn.textContent = '다시 하기';

    if (score > highScore) {
      highScore = score;
      highScoreDisplay.textContent = highScore;
    }
  }

  // 키보드 이벤트 (스페이스바 점프)
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (isPlaying) {
        player.jump();
      } else {
        startGame();
      }
    }
  });

  // 마우스 클릭 점프
  canvas.addEventListener('click', () => {
    if (isPlaying) {
      player.jump();
    }
  });

  function loop() {
    // 화면 지우기
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 입체적인 배경 그리기 (하늘과 풀밭 바닥)
    ctx.fillStyle = '#27ae60';
    ctx.fillRect(0, 185, canvas.width, 35);
    
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(0, 185, canvas.width, 6);

    // 플레이어 업데이트 및 그리기
    player.update();
    player.draw();

    // 장애물 생성 타이머
    obstacleTimer++;
    if (obstacleTimer > 90 + Math.random() * 50) {
      spawnObstacle();
      obstacleTimer = 0;
      gameSpeed += 0.05; // 시간이 지날수록 점점 빨라짐
    }

    // 장애물 이동 및 충돌 체크
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.x -= gameSpeed;

      // 장애물 이모지 그리기
      ctx.font = '30px sans-serif';
      ctx.fillText(obs.emoji, obs.x, obs.y + 28);

      // 충돌 감지 (조금 더 정교하게 판정)
      if (
        player.x + 5 < obs.x + obs.width - 5 &&
        player.x + player.width - 5 > obs.x + 5 &&
        player.y + 5 < obs.y + obs.height - 5 &&
        player.y + player.height - 5 > obs.y + 5
      ) {
        gameOver();
        return;
      }

      // 화면 밖으로 나간 장애물 제거 및 점수 획득
      if (obs.x + obs.width < 0) {
        obstacles.splice(i, 1);
        score += 10;
        scoreDisplay.textContent = score;
      }
    }

    if (isPlaying) {
      animationId = requestAnimationFrame(loop);
    }
  }

  // 초기 정지 화면 그리기
  ctx.fillStyle = '#27ae60';
  ctx.fillRect(0, 185, canvas.width, 35);
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(0, 185, canvas.width, 6);
  player.draw();
</script>

</body>
</html>
