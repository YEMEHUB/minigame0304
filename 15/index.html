<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원클릭 코인 게임</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter 및 한국어 가독성을 위한 폰트 설정 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* 전체 페이지 기본 스타일 */
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* 코인 버튼 입체감 및 애니메이션 */
        .coin-btn {
            background: radial-gradient(circle at 30% 30%, #fca5a5 0%, #ef4444 55%, #b91c1c 100%);
            box-shadow:
                0 10px 0 #7f1d1d,
                0 15px 25px rgba(0, 0, 0, 0.35),
                inset 0 4px 8px rgba(255, 255, 255, 0.55),
                inset 0 -4px 8px rgba(127, 29, 29, 0.55);
            transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.08s ease;
        }

        .coin-btn:hover {
            filter: brightness(1.05);
        }

        .coin-btn:active,
        .coin-btn.is-pressed {
            transform: translateY(7px) scale(0.96);
            box-shadow:
                0 3px 0 #7f1d1d,
                0 6px 12px rgba(0, 0, 0, 0.25),
                inset 0 4px 8px rgba(255, 255, 255, 0.45),
                inset 0 -4px 8px rgba(127, 29, 29, 0.55);
        }

        /* 떠오르는 +1 텍스트 애니메이션 */
        @keyframes floatUpFade {
            0% {
                opacity: 1;
                transform: translate(-50%, 0) scale(0.85);
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -22px) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -75px) scale(0.95);
            }
        }

        .floating-plus-one {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            font-size: 1.65rem;
            color: #fef08a;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65), 0 0 14px rgba(234, 179, 8, 0.9);
            animation: floatUpFade 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 30;
            white-space: nowrap;
        }

        /* 획득 포인트 스파크 배지 */
        @keyframes pointPopBadge {
            0% {
                opacity: 0;
                transform: translate(-50%, 6px) scale(0.7);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -10px) scale(1.08);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -52px) scale(0.95);
            }
        }

        .point-spark-badge {
            position: absolute;
            pointer-events: none;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 800;
            color: #fef9c3;
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(250, 204, 21, 0.55);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
            animation: pointPopBadge 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 29;
            white-space: nowrap;
        }

        /* 카운터 펄스 강조 */
        @keyframes counterPulse {
            0% {
                transform: scale(1);
                color: #fef08a;
            }
            45% {
                transform: scale(1.12);
                color: #fde047;
            }
            100% {
                transform: scale(1);
                color: #ffffff;
            }
        }

        .coin-count-pulse {
            animation: counterPulse 0.26s ease-out;
        }

        /* 파동 효과 애니메이션 */
        @keyframes rippleOut {
            0% {
                opacity: 0.75;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.8);
            }
        }

        .click-ripple {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 9999px;
            border: 3px solid rgba(248, 113, 113, 0.85);
            background: rgba(239, 68, 68, 0.22);
            pointer-events: none;
            animation: rippleOut 0.45s ease-out forwards;
            z-index: 20;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white flex flex-col items-center justify-between p-4 sm:p-6">

    <!-- 상단 헤더 -->
    <header class="w-full max-w-md flex items-center justify-between pt-2">
        <div class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 rounded-full bg-amber-400 animate-pulse"></span>
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-amber-100">
                원클릭 코인
            </h1>
        </div>
        <span id="clickPowerBadge" class="text-xs sm:text-sm px-3 py-1 rounded-full bg-white/10 text-indigo-200 border border-white/10">
            클릭 = +1 코인
        </span>
    </header>

    <!-- 중앙 게임 영역 -->
    <main id="gameArea" class="relative w-full max-w-md flex-1 flex flex-col items-center justify-center my-4">
        <!-- 코인 카운터 카드 -->
        <div class="w-full bg-white/10 backdrop-blur-md border border-white/15 rounded-3xl p-5 mb-6 text-center shadow-2xl">
            <p class="text-xs sm:text-sm uppercase tracking-widest text-amber-300/90 font-semibold mb-1">
                보유 코인
            </p>
            <div class="flex items-center justify-center gap-3">
                <!-- 미니 코인 아이콘 SVG -->
                <svg class="w-8 h-8 sm:w-10 sm:h-10 text-amber-400 drop-shadow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="#fef08a" stroke-width="2" />
                    <path d="M12 6v12M9.5 9.5C9.5 8.1 10.6 7 12 7s2.5 1.1 2.5 2.5-1.1 2.2-2.5 2.5-2.5 1.1-2.5 2.5S10.6 17 12 17s2.5-1.1 2.5-2.5" stroke="#854d0e" stroke-width="2" stroke-linecap="round" fill="none" />
                </svg>
                <span id="coinCount" class="text-5xl sm:text-6xl font-black tracking-tight text-white tabular-nums">
                    0
                </span>
            </div>
        </div>

        <!-- 메인 클릭 코인 버튼 -->
        <div class="relative flex items-center justify-center">
            <button
                id="coinButton"
                type="button"
                aria-label="빨간 버튼을 클릭하여 코인 얻기"
                class="coin-btn relative w-40 h-40 sm:w-48 sm:h-48 rounded-full flex items-center justify-center cursor-pointer focus:outline-none focus:ring-4 focus:ring-rose-400/50"
            ></button>
        </div>

        <p id="clickGuideText" class="mt-6 text-sm text-indigo-200/80 text-center">
            빨간 버튼을 누를 때마다 <span class="text-rose-300 font-bold">+1</span> 코인이 쌓입니다.
        </p>

        <!-- 단계별 승급 업그레이드 (0 -> 1단계(10코인) -> 2단계(50코인) -> 3단계(100코인)) -->
        <section aria-label="업그레이드" class="w-full mt-5 space-y-2.5">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs sm:text-sm font-bold text-amber-200/90 tracking-wide">
                    업그레이드
                </h2>
                <span id="currentStageBadge" class="text-xs text-indigo-300/85 font-semibold">
                    현재: 0단계
                </span>
            </div>

            <button
                id="upgradeBtn"
                type="button"
                class="w-full flex items-center justify-between px-4 py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 text-left transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <div>
                    <div id="upgradeTitle" class="text-sm font-bold text-white">추가 코인</div>
                    <div id="upgradeDesc" class="text-xs text-emerald-300">클릭당 코인 +1 증가</div>
                </div>
                <span id="upgradeCostBadge" class="px-3 py-1.5 rounded-xl bg-amber-400/20 border border-amber-300/30 text-xs sm:text-sm font-extrabold text-amber-200">
                    10 코인
                </span>
            </button>

            <!-- 두 번째 업그레이드: 300코인으로 3초마다 자동 클릭 -->
            <button
                id="autoClickUpgradeBtn"
                type="button"
                class="w-full flex items-center justify-between px-4 py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 text-left transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <div>
                    <div id="autoClickTitle" class="text-sm font-bold text-white">자동 클릭</div>
                    <div id="autoClickDesc" class="text-xs text-sky-300">3초마다 빨간 버튼 자동 클릭</div>
                </div>
                <span id="autoClickCostBadge" class="px-3 py-1.5 rounded-xl bg-amber-400/20 border border-amber-300/30 text-xs sm:text-sm font-extrabold text-amber-200">
                    300 코인
                </span>
            </button>
        </section>
    </main>

    <!-- 하단 컨트롤 영역 -->
    <footer class="w-full max-w-md flex flex-col items-center gap-3 pb-2">
        <div class="flex items-center justify-center gap-3 w-full">
            <button
                id="soundToggleBtn"
                type="button"
                class="flex-1 py-3 px-4 rounded-2xl bg-white/10 hover:bg-white/15 active:scale-[0.98] border border-white/15 text-sm font-semibold text-indigo-100 transition cursor-pointer flex items-center justify-center gap-2"
            >
                <span id="soundIcon">🔊</span>
                <span id="soundLabel">효과음 켜짐</span>
            </button>

            <button
                id="resetBtn"
                type="button"
                class="py-3 px-5 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 active:scale-[0.98] border border-rose-400/25 text-sm font-semibold text-rose-200 transition cursor-pointer"
            >
                초기화
            </button>
        </div>

        <!-- 상태 메시지 박스 (alert 대체용) -->
        <div id="statusMessage" class="min-h-[1.25rem] text-xs text-amber-300/90 text-center transition-opacity duration-200"></div>
    </footer>

    <script>
        /**
         * 원클릭 코인 게임 상태 및 로직
         * 클릭할 때마다 코인을 1씩 증가시키고 시각/청각 피드백을 제공합니다.
         */
        (function () {
            // DOM 요소 참조
            const gameArea = document.getElementById('gameArea');
            const coinCountEl = document.getElementById('coinCount');
            const coinButton = document.getElementById('coinButton');
            const clickPowerBadge = document.getElementById('clickPowerBadge');
            const clickGuideText = document.getElementById('clickGuideText');
            const currentStageBadge = document.getElementById('currentStageBadge');
            const upgradeBtn = document.getElementById('upgradeBtn');
            const upgradeTitleEl = document.getElementById('upgradeTitle');
            const upgradeDescEl = document.getElementById('upgradeDesc');
            const upgradeCostBadgeEl = document.getElementById('upgradeCostBadge');
            const autoClickUpgradeBtn = document.getElementById('autoClickUpgradeBtn');
            const autoClickTitleEl = document.getElementById('autoClickTitle');
            const autoClickDescEl = document.getElementById('autoClickDesc');
            const autoClickCostBadgeEl = document.getElementById('autoClickCostBadge');
            const soundToggleBtn = document.getElementById('soundToggleBtn');
            const soundIconEl = document.getElementById('soundIcon');
            const soundLabelEl = document.getElementById('soundLabel');
            const resetBtn = document.getElementById('resetBtn');
            const statusMessageEl = document.getElementById('statusMessage');

            // 단계별 승급 정의 (1단계: 10코인 -> +1, 2단계: 50코인 -> +1, 3단계: 100코인 -> +1)
            const BASE_COINS_PER_CLICK = 1;
            const AUTO_CLICK_COST = 300;
            const AUTO_CLICK_INTERVAL_MS = 3000;
            const upgradeStages = [
                { stage: 1, cost: 10, bonus: 1 },
                { stage: 2, cost: 50, bonus: 1 },
                { stage: 3, cost: 100, bonus: 1 }
            ];

            // 게임 상태 변수
            let coins = 0;
            let currentStage = 0;
            let autoClickEnabled = false;
            let autoClickTimer = null;
            let soundEnabled = true;
            let audioCtx = null;
            let statusTimer = null;

            /**
             * 현재 클릭당 획득할 코인 수를 계산합니다.
             * @returns {number} 클릭당 코인 수
             */
            function getCoinsPerClick() {
                const earnedBonus = upgradeStages
                    .filter((item) => item.stage <= currentStage)
                    .reduce((sum, item) => sum + item.bonus, 0);
                return BASE_COINS_PER_CLICK + earnedBonus;
            }

            /**
             * 다음 업그레이드 단계 정보를 반환합니다. 최대 단계 도달 시 null을 반환합니다.
             * @returns {object|null} 다음 단계 객체
             */
            function getNextUpgrade() {
                return upgradeStages.find((item) => item.stage === currentStage + 1) || null;
            }

            /**
             * 사용자에게 짧은 상태 메시지를 표시합니다.
             * @param {string} msg 표시할 메시지
             */
            function showStatusMessage(msg) {
                statusMessageEl.textContent = msg;
                if (statusTimer) {
                    clearTimeout(statusTimer);
                }
                statusTimer = setTimeout(() => {
                    statusMessageEl.textContent = '';
                }, 1800);
            }

            /**
             * 코인 수, 클릭당 획득량, 현재 단계 및 업그레이드 버튼 상태를 갱신합니다.
             */
            function updateUI() {
                const perClick = getCoinsPerClick();
                const nextUpgrade = getNextUpgrade();

                coinCountEl.textContent = coins.toLocaleString('ko-KR');
                clickPowerBadge.textContent = `클릭 = +${perClick} 코인`;
                clickGuideText.innerHTML = `빨간 버튼을 누를 때마다 <span class="text-rose-300 font-bold">+${perClick}</span> 코인이 쌓입니다.`;
                currentStageBadge.textContent = `현재: ${currentStage}단계`;

                if (!nextUpgrade) {
                    upgradeBtn.disabled = true;
                    upgradeTitleEl.textContent = '추가 코인';
                    upgradeDescEl.textContent = '최대 단계(3단계) 도달 완료';
                    upgradeCostBadgeEl.textContent = '최대 단계';
                    upgradeCostBadgeEl.className = 'px-3 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-400/30 text-xs sm:text-sm font-extrabold text-emerald-200';
                } else {
                    const affordable = coins >= nextUpgrade.cost;
                    upgradeBtn.disabled = !affordable;
                    upgradeTitleEl.textContent = '추가 코인';
                    upgradeDescEl.textContent = `${nextUpgrade.stage}단계 · 클릭당 코인 +${nextUpgrade.bonus} 증가`;
                    upgradeCostBadgeEl.textContent = `${nextUpgrade.cost} 코인`;
                    upgradeCostBadgeEl.className = affordable
                        ? 'px-3 py-1.5 rounded-xl bg-amber-400 text-slate-950 border border-amber-200 text-xs sm:text-sm font-extrabold shadow'
                        : 'px-3 py-1.5 rounded-xl bg-amber-400/15 border border-amber-300/25 text-xs sm:text-sm font-extrabold text-amber-200/80';
                }

                // 두 번째 업그레이드(자동 클릭) UI 갱신
                if (autoClickEnabled) {
                    autoClickUpgradeBtn.disabled = true;
                    autoClickTitleEl.textContent = '자동 클릭';
                    autoClickDescEl.textContent = '활성화됨 · 3초마다 자동 클릭 중';
                    autoClickCostBadgeEl.textContent = '활성화됨';
                    autoClickCostBadgeEl.className = 'px-3 py-1.5 rounded-xl bg-sky-500/20 border border-sky-400/30 text-xs sm:text-sm font-extrabold text-sky-200';
                } else {
                    const canAffordAuto = coins >= AUTO_CLICK_COST;
                    autoClickUpgradeBtn.disabled = !canAffordAuto;
                    autoClickTitleEl.textContent = '자동 클릭';
                    autoClickDescEl.textContent = '3초마다 빨간 버튼 자동 클릭';
                    autoClickCostBadgeEl.textContent = `${AUTO_CLICK_COST} 코인`;
                    autoClickCostBadgeEl.className = canAffordAuto
                        ? 'px-3 py-1.5 rounded-xl bg-amber-400 text-slate-950 border border-amber-200 text-xs sm:text-sm font-extrabold shadow'
                        : 'px-3 py-1.5 rounded-xl bg-amber-400/15 border border-amber-300/25 text-xs sm:text-sm font-extrabold text-amber-200/80';
                }
            }

            /**
             * 자동 클릭 타이머를 시작합니다. 중복 실행을 방지하기 위해 기존 타이머를 먼저 정리합니다.
             */
            function startAutoClickLoop() {
                stopAutoClickLoop();
                autoClickTimer = setInterval(() => {
                    if (!autoClickEnabled) return;
                    const btnRect = coinButton.getBoundingClientRect();
                    const centerX = btnRect.left + btnRect.width / 2;
                    const centerY = btnRect.top + btnRect.height / 2;

                    coinButton.classList.add('is-pressed');
                    gainCoins(centerX, centerY);
                    setTimeout(() => {
                        coinButton.classList.remove('is-pressed');
                    }, 120);
                }, AUTO_CLICK_INTERVAL_MS);
            }

            /**
             * 자동 클릭 타이머를 중지합니다.
             */
            function stopAutoClickLoop() {
                if (autoClickTimer) {
                    clearInterval(autoClickTimer);
                    autoClickTimer = null;
                }
            }

            /**
             * 클릭 위치(또는 버튼 중앙)에 "+N" 텍스트와 파동 효과를 생성합니다.
             * @param {number} amount 획득 코인 수
             * @param {number|null} clientX 포인터 X 좌표
             * @param {number|null} clientY 포인터 Y 좌표
             */
            function spawnClickFeedback(amount, clientX, clientY) {
                try {
                    const areaRect = gameArea.getBoundingClientRect();
                    const btnRect = coinButton.getBoundingClientRect();

                    let x;
                    let y;

                    if (typeof clientX === 'number' && typeof clientY === 'number' && clientX > 0 && clientY > 0) {
                        x = clientX - areaRect.left;
                        y = clientY - areaRect.top;
                    } else {
                        // 키보드(Enter/Space) 입력 시 버튼 중앙 기준
                        x = btnRect.left - areaRect.left + btnRect.width / 2;
                        y = btnRect.top - areaRect.top + btnRect.height / 2;
                    }

                    // +N 부유 텍스트 생성
                    const plusEl = document.createElement('span');
                    plusEl.className = 'floating-plus-one';
                    plusEl.textContent = `+${amount} 코인`;
                    plusEl.style.left = `${x}px`;
                    plusEl.style.top = `${y - 16}px`;

                    // 포인트 배지 생성 (약간 옆/위쪽으로 분산시켜 시각적 재미 추가)
                    const offsetX = ((Math.random() - 0.5) * 70).toFixed(0);
                    const badgeEl = document.createElement('span');
                    badgeEl.className = 'point-spark-badge';
                    badgeEl.textContent = `🪙 +${amount} PT`;
                    badgeEl.style.left = `${x + Number(offsetX)}px`;
                    badgeEl.style.top = `${y + 14}px`;

                    // 파동 링 생성
                    const rippleEl = document.createElement('span');
                    rippleEl.className = 'click-ripple';
                    rippleEl.style.left = `${x}px`;
                    rippleEl.style.top = `${y}px`;

                    gameArea.appendChild(plusEl);
                    gameArea.appendChild(badgeEl);
                    gameArea.appendChild(rippleEl);

                    // 코인 카운터 펄스 애니메이션 재시작
                    coinCountEl.classList.remove('coin-count-pulse');
                    void coinCountEl.offsetWidth;
                    coinCountEl.classList.add('coin-count-pulse');

                    // 애니메이션 종료 후 DOM 정리
                    plusEl.addEventListener('animationend', () => {
                        plusEl.remove();
                    });
                    badgeEl.addEventListener('animationend', () => {
                        badgeEl.remove();
                    });
                    rippleEl.addEventListener('animationend', () => {
                        rippleEl.remove();
                    });
                } catch (err) {
                    console.warn('시각 효과 생성 오류:', err);
                }
            }

            /**
             * 현재 클릭당 코인 수만큼 코인을 증가시키는 핵심 액션입니다.
             * @param {number|null} clientX 포인터 X 좌표
             * @param {number|null} clientY 포인터 Y 좌표
             */
            function gainCoins(clientX = null, clientY = null) {
                const amount = getCoinsPerClick();
                coins += amount;
                updateUI();
                playCoinSound();
                spawnClickFeedback(amount, clientX, clientY);
            }

            /**
             * 다음 단계로 승급합니다.
             */
            function advanceUpgradeStage() {
                const nextUpgrade = getNextUpgrade();
                if (!nextUpgrade) {
                    showStatusMessage('이미 최고 단계(3단계)에 도달했습니다.');
                    return;
                }
                if (coins < nextUpgrade.cost) {
                    showStatusMessage(`${nextUpgrade.stage}단계 업그레이드에 ${nextUpgrade.cost} 코인이 필요합니다.`);
                    return;
                }

                coins -= nextUpgrade.cost;
                currentStage = nextUpgrade.stage;
                updateUI();
                playCoinSound();
                showStatusMessage(`${currentStage}단계로 업그레이드 완료! 클릭당 +${nextUpgrade.bonus} 코인 증가`);
            }

            /**
             * 300코인을 지불해 3초마다 자동 클릭하는 업그레이드를 구매합니다.
             */
            function buyAutoClickUpgrade() {
                if (autoClickEnabled) {
                    showStatusMessage('자동 클릭이 이미 활성화되어 있습니다.');
                    return;
                }
                if (coins < AUTO_CLICK_COST) {
                    showStatusMessage(`자동 클릭 업그레이드에 ${AUTO_CLICK_COST} 코인이 필요합니다.`);
                    return;
                }

                coins -= AUTO_CLICK_COST;
                autoClickEnabled = true;
                startAutoClickLoop();
                updateUI();
                playCoinSound();
                showStatusMessage('자동 클릭 구매 완료! 3초마다 빨간 버튼을 자동으로 누릅니다.');
            }

            // 단계 업그레이드 및 자동 클릭 업그레이드 버튼 이벤트 등록
            upgradeBtn.addEventListener('click', advanceUpgradeStage);
            autoClickUpgradeBtn.addEventListener('click', buyAutoClickUpgrade);

            upgradeBtn.addEventListener('click', advanceUpgradeStage);

            // 포인터 클릭/터치 이벤트 등록
            coinButton.addEventListener('pointerdown', (event) => {
                coinButton.classList.add('is-pressed');
                gainCoins(event.clientX, event.clientY);
            });

            function releaseCoinPress() {
                coinButton.classList.remove('is-pressed');
            }

            coinButton.addEventListener('pointerup', releaseCoinPress);
            coinButton.addEventListener('pointerleave', releaseCoinPress);
            coinButton.addEventListener('pointercancel', releaseCoinPress);

            // 효과음 토글 버튼
            soundToggleBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundIconEl.textContent = soundEnabled ? '🔊' : '🔇';
                soundLabelEl.textContent = soundEnabled ? '효과음 켜짐' : '효과음 꺼짐';
                showStatusMessage(soundEnabled ? '효과음이 켜졌습니다.' : '효과음이 꺼졌습니다.');
            });

            // 코인 및 업그레이드 초기화 버튼
            resetBtn.addEventListener('click', () => {
                coins = 0;
                currentStage = 0;
                autoClickEnabled = false;
                stopAutoClickLoop();
                updateUI();
                showStatusMessage('코인과 업그레이드가 초기화되었습니다.');
            });

            // 초기 화면 렌더링
            updateUI();
        })();
    </script>
</body>
</html>
