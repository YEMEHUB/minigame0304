<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff85b3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>오리지널 다마고치 웹앱 🐣✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js (레트로 게임기 효과음) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts: Jua & Fredoka & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at top, #ffe4f0 0%, #e0f2fe 55%, #fef9c3 100%);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        .font-cute {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
        }
        .font-bubbly {
            font-family: 'Fredoka', 'Jua', sans-serif;
        }

        /* 다마고치 달걀형 본체 스타일 */
        .tama-shell {
            background: linear-gradient(145deg, #ff85b3 0%, #ff5c97 55%, #e6397a 100%);
            border-radius: 48% 48% 45% 45% / 52% 52% 42% 42%;
            box-shadow:
                inset -10px -14px 24px rgba(157, 23, 77, 0.35),
                inset 10px 14px 24px rgba(255, 255, 255, 0.55),
                0 20px 40px rgba(236, 72, 153, 0.35);
            border: 5px solid #ffffff;
        }

        /* LCD 화면 베젤 */
        .tama-bezel {
            background: linear-gradient(180deg, #fff5f8 0%, #ffe4ef 100%);
            border: 4px solid #fbcfe8;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.12);
        }

        /* 도트 격자 느낌이 살짝 감도는 파스텔 LCD 스크린 */
        .tama-screen {
            background: linear-gradient(180deg, #e8f8f5 0%, #d1fae5 100%);
            background-image:
                linear-gradient(rgba(16, 185, 129, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.06) 1px, transparent 1px),
                linear-gradient(180deg, #ecfdf5 0%, #d1fae5 100%);
            background-size: 8px 8px, 8px 8px, 100% 100%;
            box-shadow: inset 0 4px 12px rgba(6, 78, 59, 0.18);
            transition: filter 0.4s ease, background 0.4s ease;
        }

        /* 밤(수면) 모드 스크린 */
        .tama-screen.night-mode {
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
        }

        /* 본체 하단 물리 버튼 3개 */
        .tama-phys-btn {
            background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 5px 0 #a16207, 0 8px 14px rgba(0, 0, 0, 0.25);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .tama-phys-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #a16207, 0 3px 6px rgba(0, 0, 0, 0.25);
        }

        /* 캐릭터 통통 튀는 기본 아이들 애니메이션 */
        @keyframes pet-bounce {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            50% { transform: translateY(-7px) scale(0.97, 1.03); }
        }
        .animate-pet-idle {
            animation: pet-bounce 1.8s ease-in-out infinite;
        }

        /* 밥 먹을 때 냠냠 애니메이션 */
        @keyframes pet-eat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.12, 0.9) rotate(-4deg); }
            50% { transform: scale(0.94, 1.08) rotate(4deg); }
            75% { transform: scale(1.1, 0.92) rotate(-3deg); }
        }
        .animate-pet-eat {
            animation: pet-eat 0.55s ease-in-out 2;
        }

        /* 기쁠 때 점프 회전 */
        @keyframes pet-happy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-18px) rotate(-10deg); }
            60% { transform: translateY(-14px) rotate(10deg); }
        }
        .animate-pet-happy {
            animation: pet-happy 0.65s ease-in-out 2;
        }

        /* 수면 중 숨쉬기 */
        @keyframes pet-sleep {
            0%, 100% { transform: scale(1, 0.96); }
            50% { transform: scale(1.04, 0.92); }
        }
        .animate-pet-sleep {
            animation: pet-sleep 2.6s ease-in-out infinite;
        }

        /* 떠다니는 이모지 파티클 */
        @keyframes float-up {
            0% { transform: translateY(0) scale(0.7); opacity: 1; }
            100% { transform: translateY(-48px) scale(1.2); opacity: 0; }
        }
        .particle {
            position: absolute;
            pointer-events: none;
            animation: float-up 1.1s ease-out forwards;
            font-size: 1.4rem;
            z-index: 30;
        }

        /* 스크롤바 숨김 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2.5 sm:p-5 text-slate-700">

    <!-- 상단 웹앱 상태 바 -->
    <header class="w-full max-w-md bg-white/85 backdrop-blur-md border-2 border-white rounded-3xl px-4 py-2.5 shadow-sm flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
            <span class="text-xl">🐣</span>
            <div>
                <div class="flex items-center gap-1.5">
                    <h1 class="font-cute text-base sm:text-lg text-pink-600 leading-none">오리지널 다마고치</h1>
                    <span class="text-[10px] font-bold bg-pink-100 text-pink-600 px-1.5 py-0.5 rounded-full">WEB APP</span>
                </div>
                <div class="flex items-center gap-2 mt-1">
                    <span id="levelBadge" class="font-bubbly text-xs font-bold text-amber-600">Lv.1 아기</span>
                    <div class="w-20 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                        <div id="expBar" class="h-full bg-gradient-to-r from-amber-400 to-pink-400 transition-all duration-300" style="width: 10%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-1.5">
            <span id="saveIndicator" class="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full border border-emerald-200">
                💾 자동저장
            </span>
            <button id="soundBtn" class="p-2 rounded-2xl bg-pink-50 hover:bg-pink-100 text-pink-600 text-sm transition active:scale-95" title="효과음 켜기/끄기">
                🔊
            </button>
            <button id="resetBtn" class="p-2 rounded-2xl bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 text-xs font-bold transition active:scale-95" title="데이터 초기화">
                초기화
            </button>
        </div>
    </header>

    <!-- 중앙 다마고치 본체 -->
    <main class="w-full max-w-md flex flex-col items-center my-auto">
        <div class="tama-shell w-full max-w-[360px] p-5 sm:p-6 flex flex-col items-center relative">
            
            <!-- 상단 고리 장식 -->
            <div class="w-9 h-4 rounded-t-full border-4 border-white bg-pink-300/60 -mt-8 mb-2 shadow-sm"></div>

            <!-- 본체 로고 -->
            <div class="font-bubbly text-white font-bold tracking-widest text-xs sm:text-sm mb-2 drop-shadow">
                ✦ TAMAGOTCHI POCKET ✦
            </div>

            <!-- LCD 베젤 + 스크린 -->
            <div class="tama-bezel w-full rounded-[28px] p-3">
                <div id="lcdScreen" class="tama-screen w-full h-56 sm:h-60 rounded-2xl relative overflow-hidden flex flex-col justify-between p-2.5 border-2 border-emerald-900/15">
                    
                    <!-- 스크린 상단: 상태 게이지 3종 -->
                    <div class="grid grid-cols-3 gap-1.5 bg-white/75 backdrop-blur-xs rounded-xl p-1.5 text-[11px] font-bold z-10 shadow-xs">
                        <div>
                            <div class="flex justify-between text-amber-700 mb-0.5">
                                <span>🍙 배부름</span>
                                <span id="valHunger">80%</span>
                            </div>
                            <div class="w-full h-1.5 bg-amber-100 rounded-full overflow-hidden">
                                <div id="barHunger" class="h-full bg-amber-400 transition-all duration-300" style="width: 80%;"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-pink-600 mb-0.5">
                                <span>💖 행복도</span>
                                <span id="valHappy">85%</span>
                            </div>
                            <div class="w-full h-1.5 bg-pink-100 rounded-full overflow-hidden">
                                <div id="barHappy" class="h-full bg-pink-400 transition-all duration-300" style="width: 85%;"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sky-600 mb-0.5">
                                <span>⚡ 에너지</span>
                                <span id="valEnergy">90%</span>
                            </div>
                            <div class="w-full h-1.5 bg-sky-100 rounded-full overflow-hidden">
                                <div id="barEnergy" class="h-full bg-sky-400 transition-all duration-300" style="width: 90%;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 스크린 중앙: 말풍선 + 캐릭터 SVG 무대 -->
                    <div id="petStage" class="relative flex-1 flex flex-col items-center justify-center cursor-pointer">
                        <!-- 말풍선 -->
                        <div id="speechBubble" class="bg-white/95 border-2 border-slate-700 rounded-2xl px-3 py-1 text-xs font-cute text-slate-800 shadow-sm mb-1 transition-all">
                            에헤헤~ 반가워! ✨
                        </div>

                        <!-- 캐릭터 SVG 컨테이너 -->
                        <div id="petWrapper" class="w-28 h-28 sm:w-32 sm:h-32 animate-pet-idle flex items-center justify-center">
                            <!-- JS에서 동적으로 SVG 렌더링 -->
                        </div>

                        <!-- 응가 표시 (청결도 낮을 때 등장) -->
                        <div id="poopIcon" class="hidden absolute bottom-1 right-4 text-2xl animate-bounce" title="청소해 주세요!">
                            💩
                        </div>

                        <!-- 수면 Zzz 표시 -->
                        <div id="sleepZzz" class="hidden absolute top-2 right-6 font-bubbly font-bold text-indigo-200 text-lg animate-pulse">
                            Zzz... 🌙
                        </div>
                    </div>

                    <!-- 스크린 하단: 현재 캐릭터 이름 & 착용 정보 -->
                    <div class="flex justify-between items-center bg-white/75 rounded-lg px-2.5 py-1 text-[11px] font-bold text-slate-700 z-10">
                        <span id="petNameDisplay">⚡ 마메치</span>
                        <span id="outfitSummary" class="text-pink-600 truncate max-w-[140px]">기본 스타일</span>
                    </div>
                </div>
            </div>

            <!-- 본체 하단 물리 버튼 3개 (A: 탭 전환 / B: 쓰다듬기 / C: 빠른 돌보기) -->
            <div class="flex items-center justify-center gap-7 mt-4">
                <div class="flex flex-col items-center">
                    <button id="physBtnA" class="tama-phys-btn w-11 h-11 rounded-full font-bubbly font-bold text-amber-900 text-base">A</button>
                    <span class="text-[10px] font-bold text-white/90 mt-1">메뉴</span>
                </div>
                <div class="flex flex-col items-center mt-2">
                    <button id="physBtnB" class="tama-phys-btn w-12 h-12 rounded-full font-bubbly font-bold text-pink-600 text-lg">♥</button>
                    <span class="text-[10px] font-bold text-white/90 mt-1">쓰다듬기</span>
                </div>
                <div class="flex flex-col items-center">
                    <button id="physBtnC" class="tama-phys-btn w-11 h-11 rounded-full font-bubbly font-bold text-amber-900 text-base">C</button>
                    <span class="text-[10px] font-bold text-white/90 mt-1">청소/불</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 하단 컨트롤 패널 (탭 + 아이템 그리드) -->
    <section class="w-full max-w-md bg-white/90 backdrop-blur-md border-2 border-white rounded-3xl p-3 shadow-lg mt-2">
        <!-- 4개 메뉴 탭 -->
        <div class="grid grid-cols-4 gap-1.5 bg-pink-50 p-1 rounded-2xl mb-2.5">
            <button data-tab="food" class="tab-btn py-2 rounded-xl text-xs sm:text-sm font-cute bg-pink-500 text-white shadow-sm transition">
                🍙 밥먹기
            </button>
            <button data-tab="clothes" class="tab-btn py-2 rounded-xl text-xs sm:text-sm font-cute text-pink-600 hover:bg-white/60 transition">
                👗 옷입히기
            </button>
            <button data-tab="character" class="tab-btn py-2 rounded-xl text-xs sm:text-sm font-cute text-pink-600 hover:bg-white/60 transition">
                🐣 캐릭터
            </button>
            <button data-tab="care" class="tab-btn py-2 rounded-xl text-xs sm:text-sm font-cute text-pink-600 hover:bg-white/60 transition">
                🎮 돌보기
            </button>
        </div>

        <!-- 탭별 콘텐츠 컨테이너 -->
        <div id="panelContent" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto no-scrollbar p-0.5">
            <!-- JS에서 선택된 탭에 따라 버튼 렌더링 -->
        </div>
    </section>

    <!-- 초기화 확인 커스텀 모달 (alert/confirm 미사용) -->
    <div id="resetModal" class="hidden fixed inset-0 bg-slate-900/45 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-5 max-w-xs w-full text-center shadow-2xl border-4 border-pink-200">
            <div class="text-3xl mb-2">🥺</div>
            <h2 class="font-cute text-xl text-slate-800 mb-1">처음부터 다시 키울까요?</h2>
            <p class="text-xs text-slate-500 mb-4">저장된 레벨, 의상, 상태 기록이 모두 초기화됩니다.</p>
            <div class="grid grid-cols-2 gap-2">
                <button id="cancelResetBtn" class="py-2.5 rounded-2xl bg-slate-100 font-bold text-sm text-slate-600 hover:bg-slate-200">취소</button>
                <button id="confirmResetBtn" class="py-2.5 rounded-2xl bg-rose-500 font-bold text-sm text-white hover:bg-rose-600">초기화하기</button>
            </div>
        </div>
    </div>

    <!-- 다마고치 미니게임 모달 (하트 & 별 잡기) -->
    <div id="minigameModal" class="hidden fixed inset-0 bg-slate-900/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-4 max-w-xs w-full text-center shadow-2xl border-4 border-pink-300">
            <div class="flex items-center justify-between mb-2">
                <span class="font-cute text-lg text-pink-600">🎮 하트 잡기 미니게임</span>
                <button id="closeMinigameBtn" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-full">닫기</button>
            </div>

            <div class="flex justify-between items-center bg-pink-50 rounded-2xl px-3 py-1.5 mb-2 text-xs font-bold text-slate-700">
                <span>⏱️ 남은시간: <strong id="mgTime" class="text-rose-500">10.0s</strong></span>
                <span>💖 점수: <strong id="mgScore" class="text-pink-600">0점</strong></span>
            </div>

            <div id="mgArena" class="relative w-full h-52 rounded-2xl bg-gradient-to-b from-sky-100 via-pink-50 to-amber-50 border-2 border-pink-200 overflow-hidden mb-3">
                <div id="mgOverlayMsg" class="absolute inset-0 flex flex-col items-center justify-center bg-white/75 backdrop-blur-2xs p-3 z-10">
                    <p class="font-cute text-base text-slate-800 mb-1">떨어지는 💖와 ⭐를 터치하세요!</p>
                    <p class="text-[11px] text-slate-500">점수에 따라 행복도와 경험치를 얻어요.</p>
                </div>
            </div>

            <button id="startMinigameBtn" class="w-full py-2.5 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-400 text-white font-cute text-base shadow-md active:scale-95 transition">
                게임 시작!
            </button>
        </div>
    </div>

    <script>
        /**
         * 오리지널 다마고치 키우기 웹앱 (TamagotchiGame)
         * - localStorage 자동 저장/불러오기 지원
         * - 원래 다마고치 캐릭터 7종(마메치, 구치파치, 메메치, 러블리치, 미미치, 플라워치, 키키치) 전환 + 모자/의상 커스터마이징
         * - 밥먹기, 놀아주기, 청소하기, 불 끄기(수면), 쓰다듬기 육성 루프
         */
        class TamagotchiGame {
            constructor() {
                this.STORAGE_KEY = 'original_tamagotchi_webapp_v1';
                this.soundEnabled = true;
                this.synth = null;
                this.activeTab = 'food';

                // 기본 육성 상태
                this.defaultState = {
                    hunger: 80,
                    happy: 85,
                    energy: 90,
                    exp: 0,
                    level: 1,
                    hasPoop: false,
                    isSleeping: false,
                    species: 'mametchi',
                    hat: 'none',
                    outfit: 'none'
                };

                this.state = this.loadState();
                this.minigameTimer = null;
                this.minigameSpawner = null;
                this.minigameScore = 0;

                // 오리지널 다마고치 대표 캐릭터 라인업
                this.speciesList = [
                    { id: 'mametchi',   name: '마메치',   icon: '⚡', bodyColor: '#fef08a', cheekColor: '#fda4af', accent: '#2563eb', quote: '반짝! 오늘도 똑똑하게 놀자! ⚡' },
                    { id: 'kuchipatchi',name: '구치파치', icon: '💚', bodyColor: '#86efac', cheekColor: '#fb7185', accent: '#f97316', quote: '냠냠~ 맛있는 게 최고야! 💚' },
                    { id: 'memetchi',   name: '메메치',   icon: '🌀', bodyColor: '#fde047', cheekColor: '#f472b6', accent: '#ec4899', quote: '빙글빙글~ 패션과 댄스 최고! 🌀' },
                    { id: 'lovelitchi', name: '러블리치', icon: '🎀', bodyColor: '#fff1f2', cheekColor: '#fb7185', accent: '#f43f5e', quote: '하트 뿅뿅~ 다 함께 반짝여! 🎀' },
                    { id: 'mimitchi',   name: '미미치',   icon: '🐰', bodyColor: '#ffffff', cheekColor: '#fda4af', accent: '#334155', quote: '쫑긋! 포근포근 기분 좋아~ 🐰' },
                    { id: 'flowertchi', name: '플라워치', icon: '🌸', bodyColor: '#bbf7d0', cheekColor: '#f472b6', accent: '#facc15', quote: '살랑살랑~ 꽃향기 가득해! 🌸' },
                    { id: 'kikitchi',   name: '키키치',   icon: '🐵', bodyColor: '#fbbf24', cheekColor: '#fda4af', accent: '#d97706', quote: '우끼끼! 신나게 놀자! 🍌' }
                ];

                // 밥 & 간식 데이터
                this.foodList = [
                    { id: 'onigiri',   name: '주먹밥',     icon: '🍙', hunger: 22, happy: 6,  energy: 5,  exp: 12, msg: '냠냠! 고소해~ 🍙' },
                    { id: 'cake',      name: '딸기케이크', icon: '🍰', hunger: 25, happy: 22, energy: 8,  exp: 18, msg: '달콤상큼 딸기케이크 최고! 🍰' },
                    { id: 'pancake',   name: '핫케이크',   icon: '🥞', hunger: 20, happy: 20, energy: 8,  exp: 16, msg: '달콤폭신 행복해~ 🍯' },
                    { id: 'pudding',   name: '거대 푸딩',  icon: '🍮', hunger: 15, happy: 25, energy: 10, exp: 18, msg: '탱글탱글 사르르~ 🍮' },
                    { id: 'melon',     name: '메론빵',     icon: '🍈', hunger: 18, happy: 14, energy: 8,  exp: 14, msg: '바삭달콤 메론빵! ✨' },
                    { id: 'milk',      name: '따뜻한 우유',icon: '🥛', hunger: 10, happy: 10, energy: 22, exp: 12, msg: '꿀꺽꿀꺽 힘이 난다! 💪' }
                ];

                // 옷 & 액세서리 데이터 (모자/머리장식 + 의상)
                this.clothesList = [
                    { id: 'hat_none',   type: 'hat',    value: 'none',      name: '모자 벗기',   icon: '🚫' },
                    { id: 'hat_crown',  type: 'hat',    value: 'crown',     name: '황금 왕관',   icon: '👑' },
                    { id: 'hat_ribbon', type: 'hat',    value: 'ribbon',    name: '왕리본 핀',   icon: '🎀' },
                    { id: 'hat_pajama', type: 'hat',    value: 'pajama',    name: '파자마 모자', icon: '💤' },
                    { id: 'out_none',   type: 'outfit', value: 'none',      name: '옷 벗기',     icon: '👕' },
                    { id: 'out_pochette',type:'outfit', value: 'pochette',  name: '곰돌이 가방', icon: '🧸' },
                    { id: 'out_scarf',  type: 'outfit', value: 'scarf',     name: '빨간 목도리', icon: '🧣' },
                    { id: 'out_overall',type: 'outfit', value: 'overall',   name: '멜빵 바지',   icon: '👖' },
                    { id: 'out_pajama', type: 'outfit', value: 'pajama',    name: '파자마 파티', icon: '🌙' }
                ];

                // 돌보기 액션 데이터
                this.careList = [
                    { id: 'minigame', name: '미니게임', icon: '🎮', msg: '미니게임으로 신나게 놀아보자! 🎮' },
                    { id: 'sing',     name: '노래 부르기', icon: '🎵', msg: '랄랄라~ 파자마 파티! 🎶' },
                    { id: 'clean',    name: '깔끔 청소', icon: '🧹', msg: '반짝반짝 깨끗해졌어! ✨' },
                    { id: 'sleep',    name: '불 끄기/켜기', icon: '🛌', msg: '잘 자요~ 좋은 꿈 꿔! 🌙' }
                ];

                this.initEvents();
                this.renderPanel();
                this.updateUI();
                this.startLifeLoop();
            }

            // localStorage에서 상태 불러오기
            loadState() {
                try {
                    const saved = localStorage.getItem(this.STORAGE_KEY);
                    if (saved) {
                        return { ...this.defaultState, ...JSON.parse(saved) };
                    }
                } catch (e) {
                    console.warn('저장 데이터 로드 실패:', e);
                }
                return { ...this.defaultState };
            }

            // localStorage에 상태 저장
            saveState() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
                    const indicator = document.getElementById('saveIndicator');
                    if (indicator) {
                        indicator.textContent = '💾 저장됨!';
                        setTimeout(() => {
                            indicator.textContent = '💾 자동저장';
                        }, 900);
                    }
                } catch (e) {
                    console.warn('저장 실패:', e);
                }
            }

            // 사운드 초기화 및 재생
            async playTone(type) {
                if (!this.soundEnabled || !window.Tone) return;
                try {
                    if (!this.synth) {
                        await Tone.start();
                        this.synth = new Tone.Synth({
                            oscillator: { type: 'triangle' },
                            envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
                        }).toDestination();
                    }
                    const now = Tone.now();
                    if (type === 'blip') {
                        this.synth.triggerAttackRelease('C6', '32n', now);
                    } else if (type === 'eat') {
                        this.synth.triggerAttackRelease('E5', '32n', now);
                        this.synth.triggerAttackRelease('G5', '32n', now + 0.08);
                        this.synth.triggerAttackRelease('C6', '16n', now + 0.16);
                    } else if (type === 'love') {
                        this.synth.triggerAttackRelease('A5', '32n', now);
                        this.synth.triggerAttackRelease('E6', '16n', now + 0.08);
                    } else if (type === 'levelup') {
                        this.synth.triggerAttackRelease('C5', '16n', now);
                        this.synth.triggerAttackRelease('E5', '16n', now + 0.08);
                        this.synth.triggerAttackRelease('G5', '16n', now + 0.16);
                        this.synth.triggerAttackRelease('C6', '8n', now + 0.24);
                    }
                } catch (e) {}
            }

            // 이벤트 바인딩
            initEvents() {
                // 하단 메뉴 탭 전환
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.playTone('blip');
                        this.activeTab = btn.dataset.tab;
                        this.updateTabStyles();
                        this.renderPanel();
                    });
                });

                // 화면 속 캐릭터 직접 터치(쓰다듬기)
                document.getElementById('petStage').addEventListener('click', () => {
                    this.petCharacter();
                });

                // 물리 버튼 A: 다음 탭 순환
                document.getElementById('physBtnA').addEventListener('click', () => {
                    this.playTone('blip');
                    const tabs = ['food', 'clothes', 'character', 'care'];
                    const nextIdx = (tabs.indexOf(this.activeTab) + 1) % tabs.length;
                    this.activeTab = tabs[nextIdx];
                    this.updateTabStyles();
                    this.renderPanel();
                });

                // 물리 버튼 B: 쓰다듬기
                document.getElementById('physBtnB').addEventListener('click', () => {
                    this.petCharacter();
                });

                // 물리 버튼 C: 응가 있으면 청소, 없으면 수면 토글
                document.getElementById('physBtnC').addEventListener('click', () => {
                    if (this.state.hasPoop) {
                        this.doCare('clean');
                    } else {
                        this.doCare('sleep');
                    }
                });

                // 효과음 토글
                document.getElementById('soundBtn').addEventListener('click', () => {
                    this.soundEnabled = !this.soundEnabled;
                    document.getElementById('soundBtn').textContent = this.soundEnabled ? '🔊' : '🔇';
                });

                // 초기화 모달 제어
                document.getElementById('resetBtn').addEventListener('click', () => {
                    document.getElementById('resetModal').classList.remove('hidden');
                });
                document.getElementById('cancelResetBtn').addEventListener('click', () => {
                    document.getElementById('resetModal').classList.add('hidden');
                });
                document.getElementById('confirmResetBtn').addEventListener('click', () => {
                    this.state = { ...this.defaultState };
                    this.saveState();
                    this.updateUI();
                    this.renderPanel();
                    document.getElementById('resetModal').classList.add('hidden');
                    this.say('새롭게 다시 시작하자! ✨');
                });

                // 미니게임 모달 이벤트
                document.getElementById('startMinigameBtn').addEventListener('click', () => {
                    this.startMinigame();
                });
                document.getElementById('closeMinigameBtn').addEventListener('click', () => {
                    this.stopMinigame(false);
                    document.getElementById('minigameModal').classList.add('hidden');
                });
            }

            // 활성화된 메뉴 탭 버튼 스타일 동기화
            updateTabStyles() {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    const isActive = btn.dataset.tab === this.activeTab;
                    btn.className = isActive
                        ? 'tab-btn py-2 rounded-xl text-xs sm:text-sm font-cute bg-pink-500 text-white shadow-sm transition'
                        : 'tab-btn py-2 rounded-xl text-xs sm:text-sm font-cute text-pink-600 hover:bg-white/60 transition';
                });
            }

            // 경험치 및 레벨업 처리
            addExp(amount) {
                this.state.exp += amount;
                const reqExp = this.state.level * 50;
                if (this.state.exp >= reqExp) {
                    this.state.exp -= reqExp;
                    this.state.level += 1;
                    this.playTone('levelup');
                    this.spawnParticle('🎉');
                    this.say(`레벨 업! Lv.${this.state.level} 달성! 🌟`);
                }
            }

            // 말풍선 출력
            say(text) {
                const bubble = document.getElementById('speechBubble');
                bubble.textContent = text;
                bubble.classList.add('scale-105');
                setTimeout(() => bubble.classList.remove('scale-105'), 250);
            }

            // 파티클 이모지 생성
            spawnParticle(emoji) {
                const stage = document.getElementById('petStage');
                const el = document.createElement('span');
                el.className = 'particle';
                el.textContent = emoji;
                el.style.left = `${35 + Math.random() * 30}%`;
                el.style.top = '45%';
                stage.appendChild(el);
                setTimeout(() => el.remove(), 1100);
            }

            // 일시적 캐릭터 모션 변경
            triggerAnimation(animClass, duration = 1200) {
                const wrapper = document.getElementById('petWrapper');
                wrapper.classList.remove('animate-pet-idle', 'animate-pet-eat', 'animate-pet-happy', 'animate-pet-sleep');
                void wrapper.offsetWidth;
                wrapper.classList.add(animClass);
                setTimeout(() => {
                    wrapper.classList.remove(animClass);
                    wrapper.classList.add(this.state.isSleeping ? 'animate-pet-sleep' : 'animate-pet-idle');
                }, duration);
            }

            // 쓰다듬기 상호작용
            petCharacter() {
                if (this.state.isSleeping) {
                    this.say('새근새근... 자고 있어 💤');
                    this.spawnParticle('💤');
                    return;
                }
                this.playTone('love');
                this.state.happy = Math.min(100, this.state.happy + 5);
                this.addExp(5);
                this.triggerAnimation('animate-pet-happy', 1100);
                this.spawnParticle('💖');
                const sp = this.speciesList.find(s => s.id === this.state.species);
                this.say(sp ? sp.quote : '기분 최고야! 💖');
                this.saveState();
                this.updateUI();
            }

            // 밥 먹이기
            feedPet(food) {
                if (this.state.isSleeping) {
                    this.say('자고 있어서 먹을 수 없어! 🌙');
                    return;
                }
                if (this.state.hunger >= 100) {
                    this.say('배가 빵빵해서 더 못 먹어! 😆');
                    return;
                }
                this.playTone('eat');
                this.state.hunger = Math.min(100, this.state.hunger + food.hunger);
                this.state.happy = Math.min(100, this.state.happy + food.happy);
                this.state.energy = Math.min(100, this.state.energy + food.energy);
                this.addExp(food.exp);
                this.triggerAnimation('animate-pet-eat', 1100);
                this.spawnParticle(food.icon);
                this.say(food.msg);
                this.saveState();
                this.updateUI();
            }

            // 옷/모자 착용
            wearItem(item) {
                this.playTone('love');
                if (item.type === 'hat') {
                    this.state.hat = item.value;
                } else {
                    this.state.outfit = item.value;
                }
                this.triggerAnimation('animate-pet-happy', 900);
                this.spawnParticle('✨');
                this.say(`${item.name} 착용 완료! 어때? 💕`);
                this.saveState();
                this.updateUI();
                this.renderPanel();
            }

            // 캐릭터 변경
            changeSpecies(speciesId) {
                this.playTone('love');
                this.state.species = speciesId;
                const sp = this.speciesList.find(s => s.id === speciesId);
                this.triggerAnimation('animate-pet-happy', 1000);
                this.spawnParticle(sp.icon);
                this.say(`안녕! 나는 ${sp.name}야! ${sp.quote}`);
                this.saveState();
                this.updateUI();
                this.renderPanel();
            }

            // 돌보기 액션
            doCare(careId) {
                if (this.state.isSleeping && careId !== 'sleep') {
                    this.say('자고 있어서 지금은 안 돼! 🌙');
                    return;
                }

                if (careId === 'minigame') {
                    this.playTone('blip');
                    this.openMinigame();
                } else if (careId === 'sing') {
                    this.playTone('levelup');
                    this.state.happy = Math.min(100, this.state.happy + 18);
                    this.state.energy = Math.max(0, this.state.energy - 5);
                    this.addExp(14);
                    this.triggerAnimation('animate-pet-happy', 1200);
                    this.spawnParticle('🎵');
                    this.say('랄랄라~ 다 함께 노래 불러요! 🎶');
                } else if (careId === 'clean') {
                    this.playTone('eat');
                    this.state.hasPoop = false;
                    this.state.happy = Math.min(100, this.state.happy + 10);
                    this.addExp(10);
                    this.triggerAnimation('animate-pet-happy', 1000);
                    this.spawnParticle('✨');
                    this.say('반짝반짝 깨끗해졌어! 상쾌해! ✨');
                } else if (careId === 'sleep') {
                    this.playTone('blip');
                    this.state.isSleeping = !this.state.isSleeping;
                    this.say(this.state.isSleeping ? '불 껐어! 잘 자~ 🌙' : '일어났어! 좋은 아침! ☀️');
                }

                this.saveState();
                this.updateUI();
            }

            // 미니게임 모달 열기
            openMinigame() {
                this.stopMinigame(false);
                this.minigameScore = 0;
                document.getElementById('mgScore').textContent = '0점';
                document.getElementById('mgTime').textContent = '10.0s';
                document.getElementById('mgOverlayMsg').classList.remove('hidden');
                document.getElementById('startMinigameBtn').disabled = false;
                document.getElementById('startMinigameBtn').textContent = '게임 시작!';
                document.getElementById('minigameModal').classList.remove('hidden');
            }

            // 미니게임 시작 (10초간 떨어지는 하트/별 터치)
            startMinigame() {
                this.stopMinigame(false);
                const arena = document.getElementById('mgArena');
                const startBtn = document.getElementById('startMinigameBtn');
                const overlay = document.getElementById('mgOverlayMsg');

                arena.querySelectorAll('.mg-item').forEach(el => el.remove());
                overlay.classList.add('hidden');
                startBtn.disabled = true;
                startBtn.textContent = '진행 중...';

                this.minigameScore = 0;
                document.getElementById('mgScore').textContent = '0점';

                let remaining = 10.0;
                const tickMs = 100;

                this.minigameSpawner = setInterval(() => {
                    const item = document.createElement('button');
                    const isStar = Math.random() < 0.35;
                    item.type = 'button';
                    item.className = 'mg-item absolute text-2xl transition-transform active:scale-125 cursor-pointer select-none';
                    item.textContent = isStar ? '⭐' : '💖';
                    item.style.left = `${8 + Math.random() * 78}%`;
                    item.style.top = '-28px';

                    let yPos = -28;
                    const fallSpeed = 2.4 + Math.random() * 1.8;

                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.playTone('blip');
                        this.minigameScore += isStar ? 20 : 10;
                        document.getElementById('mgScore').textContent = `${this.minigameScore}점`;
                        item.remove();
                    });

                    arena.appendChild(item);

                    const fallInterval = setInterval(() => {
                        yPos += fallSpeed;
                        item.style.top = `${yPos}px`;
                        if (yPos > arena.clientHeight + 10) {
                            clearInterval(fallInterval);
                            item.remove();
                        }
                    }, 30);
                }, 550);

                this.minigameTimer = setInterval(() => {
                    remaining = Math.max(0, Number((remaining - 0.1).toFixed(1)));
                    document.getElementById('mgTime').textContent = `${remaining.toFixed(1)}s`;
                    if (remaining <= 0) {
                        this.stopMinigame(true);
                    }
                }, tickMs);
            }

            // 미니게임 종료 및 보상 지급
            stopMinigame(giveReward) {
                if (this.minigameTimer) {
                    clearInterval(this.minigameTimer);
                    this.minigameTimer = null;
                }
                if (this.minigameSpawner) {
                    clearInterval(this.minigameSpawner);
                    this.minigameSpawner = null;
                }

                const arena = document.getElementById('mgArena');
                if (arena) {
                    arena.querySelectorAll('.mg-item').forEach(el => el.remove());
                }

                const startBtn = document.getElementById('startMinigameBtn');
                if (startBtn) {
                    startBtn.disabled = false;
                    startBtn.textContent = '다시 하기!';
                }

                if (giveReward) {
                    const happyGain = Math.min(25, Math.max(5, Math.floor(this.minigameScore / 10)));
                    const expGain = Math.max(8, Math.floor(this.minigameScore / 4));
                    this.state.happy = Math.min(100, this.state.happy + happyGain);
                    this.state.energy = Math.max(0, this.state.energy - 8);
                    this.addExp(expGain);
                    this.triggerAnimation('animate-pet-happy', 1200);
                    this.spawnParticle('🎮');
                    this.say(`미니게임 ${this.minigameScore}점! 행복 +${happyGain} 💖`);
                    this.saveState();
                    this.updateUI();

                    const overlay = document.getElementById('mgOverlayMsg');
                    if (overlay) {
                        overlay.innerHTML = `
                            <p class="font-cute text-lg text-pink-600 mb-1">🎉 ${this.minigameScore}점 달성!</p>
                            <p class="text-xs font-bold text-slate-700">행복도 +${happyGain}% · 경험치 +${expGain}</p>
                        `;
                        overlay.classList.remove('hidden');
                    }
                }
            }

            // 현재 선택된 탭에 맞는 하단 패널 버튼 렌더링
            renderPanel() {
                const panel = document.getElementById('panelContent');
                if (!panel) return;
                panel.innerHTML = '';

                if (this.activeTab === 'food') {
                    this.foodList.forEach(food => {
                        const btn = document.createElement('button');
                        btn.className = 'bg-amber-50 hover:bg-amber-100 border-2 border-amber-200 rounded-2xl p-2 flex flex-col items-center justify-center transition active:scale-95';
                        btn.innerHTML = `
                            <span class="text-xl mb-0.5">${food.icon}</span>
                            <span class="font-cute text-xs text-slate-800">${food.name}</span>
                            <span class="text-[10px] font-bold text-amber-600">+${food.hunger} 배부름</span>
                        `;
                        btn.addEventListener('click', () => this.feedPet(food));
                        panel.appendChild(btn);
                    });
                } else if (this.activeTab === 'clothes') {
                    this.clothesList.forEach(item => {
                        const isEquipped = (item.type === 'hat' && this.state.hat === item.value) ||
                                         (item.type === 'outfit' && this.state.outfit === item.value);
                        const btn = document.createElement('button');
                        btn.className = `rounded-2xl p-2 flex flex-col items-center justify-center border-2 transition active:scale-95 ${
                            isEquipped
                                ? 'bg-pink-100 border-pink-400 shadow-xs'
                                : 'bg-pink-50/70 hover:bg-pink-100 border-pink-200'
                        }`;
                        btn.innerHTML = `
                            <span class="text-xl mb-0.5">${item.icon}</span>
                            <span class="font-cute text-xs text-slate-800">${item.name}</span>
                            <span class="text-[10px] font-bold ${isEquipped ? 'text-pink-600' : 'text-slate-400'}">${isEquipped ? '착용 중' : '입히기'}</span>
                        `;
                        btn.addEventListener('click', () => this.wearItem(item));
                        panel.appendChild(btn);
                    });
                } else if (this.activeTab === 'character') {
                    this.speciesList.forEach(sp => {
                        const isCurrent = this.state.species === sp.id;
                        const btn = document.createElement('button');
                        btn.className = `rounded-2xl p-2 flex flex-col items-center justify-center border-2 transition active:scale-95 ${
                            isCurrent
                                ? 'bg-sky-100 border-sky-400 shadow-xs'
                                : 'bg-sky-50/70 hover:bg-sky-100 border-sky-200'
                        }`;
                        btn.innerHTML = `
                            <span class="text-xl mb-0.5">${sp.icon}</span>
                            <span class="font-cute text-xs text-slate-800">${sp.name}</span>
                            <span class="text-[10px] font-bold ${isCurrent ? 'text-sky-600' : 'text-slate-400'}">${isCurrent ? '선택됨' : '변신'}</span>
                        `;
                        btn.addEventListener('click', () => this.changeSpecies(sp.id));
                        panel.appendChild(btn);
                    });
                } else if (this.activeTab === 'care') {
                    this.careList.forEach(care => {
                        const btn = document.createElement('button');
                        btn.className = 'bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-200 rounded-2xl p-2 flex flex-col items-center justify-center transition active:scale-95';
                        btn.innerHTML = `
                            <span class="text-xl mb-0.5">${care.icon}</span>
                            <span class="font-cute text-xs text-slate-800">${care.name}</span>
                            <span class="text-[10px] font-bold text-emerald-600">실행</span>
                        `;
                        btn.addEventListener('click', () => this.doCare(care.id));
                        panel.appendChild(btn);
                    });
                }
            }

            // 오리지널 다마고치 7종 + 모자 + 의상을 결합한 손그림 크레용 스타일 SVG 렌더링
            renderPetSVG() {
                const sp = this.speciesList.find(s => s.id === this.state.species) || this.speciesList[0];
                const isSleeping = this.state.isSleeping;
                const inkColor = '#1e4b8a';

                let headFeatureSVG = '';
                let bodyPathSVG = '';
                let mouthSVG = '';
                let limbsSVG = '';

                if (sp.id === 'mametchi') {
                    // 이미지 하단 마메치 스타일: 짙은 네이비 귀+머리 윗부분, 크림 노랑 얼굴, 반짝이는 큰 눈, 앙증맞은 팔다리
                    headFeatureSVG = `
                        <path d="M40 33 C37 14, 52 12, 53 31 Z" fill="#1e4b8a" stroke="${inkColor}" stroke-width="3.4" stroke-linejoin="round"/>
                        <path d="M67 31 C68 12, 83 14, 80 33 Z" fill="#1e4b8a" stroke="${inkColor}" stroke-width="3.4" stroke-linejoin="round"/>
                    `;
                    bodyPathSVG = `
                        <path d="M35 58 C34 34, 86 34, 85 58 C85 74, 74 79, 60 79 C46 79, 35 74, 35 58 Z"
                              fill="#fff59d" stroke="${inkColor}" stroke-width="3.5" stroke-linejoin="round"/>
                        <path d="M39 39 Q60 32 81 39 L80 45 Q60 40 40 45 Z" fill="#1e4b8a"/>
                    `;
                    limbsSVG = `
                        <path d="M37 74 C29 76, 29 84, 38 83" fill="#fff59d" stroke="${inkColor}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M83 74 C91 76, 91 84, 82 83" fill="#fff59d" stroke="${inkColor}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

                    bodyPathSVG = `

                    `;

                        <path d="M84 68 C93 70, 92 78, 83 77" fill="#fde047" stroke="${inkColor}" stroke-width="3.2" stroke-linecap="round"/>

                    `;

                        <path d="M54 65 Q60 71 66 65" fill="none" stroke="${inkColor}" stroke-width="2.7" stroke-linecap="round"/>

                }

                // 눈 SVG (이미지 스타일의 도톰한 블루/네이비 눈 또는 감은 눈)
                let eyesSVG = '';
                if (isSleeping || sp.id === 'kuchipatchi') {
                    eyesSVG = `
                        <path d="M42 54 Q46 58 50 54" fill="none" stroke="${inkColor}" stroke-width="2.8" stroke-linecap="round"/>

                    `;
                } else if (sp.id === 'mametchi') {
                    eyesSVG = `
                        <ellipse cx="47" cy="54" rx="5.5" ry="7.5" fill="${inkColor}"/>
                        <ellipse cx="45.2" cy="52" rx="2" ry="2.8" fill="#ffffff"/>
                        <ellipse cx="73" cy="54" rx="5.5" ry="7.5" fill="${inkColor}"/>

                const cheekFill = sp.id === 'kuchipatchi' ? '#e6ee4c' : '#fbcfe8';
                const cheeksSVG = sp.id === 'kuchipatchi' ? `
                    <ellipse cx="45" cy="65" rx="5.5" ry="4.5" fill="${cheekFill}" opacity="0.9"/>

                // 의상 SVG
                let outfitSVG = '';
                if (this.state.outfit === 'pochette') {
                    outfitSVG = `
                        <line x1="41" y1="68" x2="75" y2="83" stroke="#92400e" stroke-width="2.6"/>

                } else if (this.state.outfit === 'scarf') {
                    outfitSVG = `
                        <path d="M36 71 Q60 78 84 71 L82 77 Q60 83 38 77 Z" fill="#fb7185" stroke="${inkColor}" stroke-width="2.2"/>

                // 모자/머리장식 SVG
                let hatSVG = '';
                if (this.state.hat === 'crown') {

            // 전체 화면 UI 동기화
            updateUI() {
                // 상단 게이지
                document.getElementById('valHunger').textContent = `${Math.round(this.state.hunger)}%`;
                document.getElementById('barHunger').style.width = `${this.state.hunger}%`;

                document.getElementById('valHappy').textContent = `${Math.round(this.state.happy)}%`;
                document.getElementById('barHappy').style.width = `${this.state.happy}%`;

                document.getElementById('valEnergy').textContent = `${Math.round(this.state.energy)}%`;
                document.getElementById('barEnergy').style.width = `${this.state.energy}%`;

                // 레벨 & 경험치
                const reqExp = this.state.level * 50;
                const expPct = Math.min(100, Math.round((this.state.exp / reqExp) * 100));
                document.getElementById('levelBadge').textContent = `Lv.${this.state.level} 친구`;
                document.getElementById('expBar').style.width = `${expPct}%`;

                // 캐릭터 이름 및 의상 요약
                const sp = this.speciesList.find(s => s.id === this.state.species) || this.speciesList[0];
                document.getElementById('petNameDisplay').textContent = `${sp.icon} ${sp.name}`;

                const hatItem = this.clothesList.find(c => c.type === 'hat' && c.value === this.state.hat);
                const outItem = this.clothesList.find(c => c.type === 'outfit' && c.value === this.state.outfit);
                const summaryParts = [];
                if (hatItem && hatItem.value !== 'none') summaryParts.push(hatItem.name);
                if (outItem && outItem.value !== 'none') summaryParts.push(outItem.name);
                document.getElementById('outfitSummary').textContent = summaryParts.length > 0 ? summaryParts.join(' + ') : '기본 스타일';

                // 수면 모드 및 응가 상태 반영
                const screen = document.getElementById('lcdScreen');
                const sleepZzz = document.getElementById('sleepZzz');
                const wrapper = document.getElementById('petWrapper');

                if (this.state.isSleeping) {
                    screen.classList.add('night-mode');
                    sleepZzz.classList.remove('hidden');
                    wrapper.classList.remove('animate-pet-idle');
                    wrapper.classList.add('animate-pet-sleep');
                } else {
                    screen.classList.remove('night-mode');
                    sleepZzz.classList.add('hidden');
                    wrapper.classList.remove('animate-pet-sleep');
                    wrapper.classList.add('animate-pet-idle');
                }

                document.getElementById('poopIcon').classList.toggle('hidden', !this.state.hasPoop);

                // SVG 캐릭터 갱신
                wrapper.innerHTML = this.renderPetSVG();
            }

            // 실시간 시간 경과에 따른 상태 변화 루프 (4초마다 갱신)
            startLifeLoop() {
                setInterval(() => {
                    if (this.state.isSleeping) {
                        // 자는 동안 에너지 회복
                        this.state.energy = Math.min(100, this.state.energy + 4);
                        this.state.hunger = Math.max(0, this.state.hunger - 1);
                    } else {
                        // 깨어있는 동안 배고픔과 에너지 서서히 감소
                        this.state.hunger = Math.max(0, this.state.hunger - 2);
                        this.state.energy = Math.max(0, this.state.energy - 1);
                        if (this.state.hasPoop || this.state.hunger < 25) {
                            this.state.happy = Math.max(0, this.state.happy - 2);
                        }
                        // 일정 확률로 응가 발생
                        if (!this.state.hasPoop && this.state.hunger > 40 && Math.random() < 0.08) {
                            this.state.hasPoop = true;
                            this.say('으앗! 청소해 주세요~ 💩');
                        }
                    }
                    this.saveState();
                    this.updateUI();
                }, 4000);
            }
        }

        window.onload = () => {
            new TamagotchiGame();
        };
    </script>
