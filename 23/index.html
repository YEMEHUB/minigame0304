<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이시클 2장 하이카드 대결</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display (클래식 카드 폰트), Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <!-- Tone.js (카드 셔플, 뒤집기, 승리/패배 효과음) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            /* 한층 더 어둡고 묵직한 카지노 VIP 룸 딥그린 펠트 배경 */
            background-color: #03170d;
            background-image: 
                radial-gradient(circle at 50% 42%, rgba(12, 62, 37, 0.72) 0%, rgba(4, 24, 14, 0.96) 68%, rgba(1, 8, 4, 1) 100%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 4px);
        }

        .font-card {
            font-family: 'Playfair Display', serif;
        }

        /* 3D 카드 플립 컨테이너 */
        .card-slot {
            perspective: 1000px;
            width: 104px;
            height: 148px;
        }
        @media (min-width: 640px) {
            .card-slot {
                width: 126px;
                height: 178px;
            }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45), 0 2px 5px rgba(0, 0, 0, 0.3);
            overflow: hidden; /* 카드를 벗어나는 그래픽 차단 */
        }

        /* 바이시클(Bicycle) 스타일 클래식 카드 뒷면 패턴 */
        .bicycle-back {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            padding: 6px;
            border: 1px solid #cbd5e1;
        }
        .bicycle-back-pattern {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background-color: #7f1d1d;
            border: 2px solid #450a0a;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(220, 38, 38, 0.55) 0%, rgba(127, 29, 29, 0.95) 85%),
                repeating-linear-gradient(45deg, rgba(254, 202, 202, 0.14) 0px, rgba(254, 202, 202, 0.14) 2px, transparent 2px, transparent 6px),
                repeating-linear-gradient(-45deg, rgba(254, 202, 202, 0.14) 0px, rgba(254, 202, 202, 0.14) 2px, transparent 2px, transparent 6px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.55);
        }
        .bicycle-back-pattern::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1.5px solid rgba(253, 224, 71, 0.45);
            border-radius: 5px;
            pointer-events: none;
        }

        /* 카드 앞면 (바이시클 에어쿠션 리넨 질감 & 입체 베벨) */
        .card-front {
            background-color: #fcfbf7;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.95) 0%, rgba(244, 241, 234, 0.85) 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.018) 0px, rgba(0,0,0,0.018) 1px, transparent 1px, transparent 3px),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.018) 0px, rgba(0,0,0,0.018) 1px, transparent 1px, transparent 3px);
            transform: rotateY(180deg);
            border: 1px solid #d6d3d1;
            box-shadow: 
                inset 0 0 0 1.5px rgba(255, 255, 255, 0.9),
                inset 0 0 14px rgba(180, 165, 140, 0.22),
                0 12px 24px rgba(0, 0, 0, 0.55);
        }

        /* 카드 뭉치(Deck) 입체감 */
        .deck-stack {
            box-shadow: 
                1px 1px 0 #e5e7eb,
                2px 2px 0 #9ca3af,
                3px 3px 0 #e5e7eb,
                4px 4px 0 #9ca3af,
                5px 5px 0 #e5e7eb,
                6px 8px 16px rgba(0, 0, 0, 0.55);
        }

        /* 카드 배분 등장 애니메이션 */
        @keyframes dealIn {
            0% {
                opacity: 0;
                transform: translateY(-25px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-deal {
            animation: dealIn 0.35s ease-out forwards;
        }

        /* 딜러 손 미세 움직임 및 배분 모션 */
        @keyframes dealerHover {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(4px); }
        }
        .dealer-hands-idle {
            animation: dealerHover 3.5s ease-in-out infinite;
        }
        @keyframes dealerDealMotion {
            0% { transform: translateY(0px) scale(1); }
            45% { transform: translateY(16px) scale(1.03); }
            100% { transform: translateY(0px) scale(1); }
        }
        .dealer-hands-dealing {
            animation: dealerDealMotion 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 매 판 자동 셔플 시 딜러 양손 교차 셔플 모션 */
        @keyframes dealerShuffleMotion {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-14px, 12px) rotate(-4deg); }
            30% { transform: translate(14px, 8px) rotate(4deg); }
            45% { transform: translate(-12px, 14px) rotate(-3deg); }
            60% { transform: translate(12px, 10px) rotate(3deg); }
            75% { transform: translate(-6px, 16px) rotate(-1.5deg); }
            90% { transform: translate(6px, 6px) rotate(1.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .dealer-hands-shuffling {
            animation: dealerShuffleMotion 0.78s ease-in-out;
        }

        /* 셔플 시 카드 뭉치(덱) 리플 진동 모션 */
        @keyframes deckShufflePulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            20% { transform: translateX(-5px) rotate(-5deg) scale(1.04); }
            40% { transform: translateX(5px) rotate(5deg) scale(1.04); }
            60% { transform: translateX(-4px) rotate(-3deg) scale(1.02); }
            80% { transform: translateX(4px) rotate(3deg) scale(1.02); }
        }
        .deck-shuffling {
            animation: deckShufflePulse 0.75s ease-in-out;
        }

        /* 오픈 가능한 내 카드 강조 효과 */
        .card-clickable {
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-clickable:hover {
            transform: translateY(-6px);
        }

        /* 승리 배너 팝업 */
        @keyframes bannerPop {
            0% { transform: scale(0.7); opacity: 0; }
            70% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-banner {
            animation: bannerPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 overflow-x-hidden relative">

    <!-- 상단 어두운 비네팅 조명 효과 -->
    <div class="fixed inset-0 pointer-events-none shadow-[inset_0_0_130px_rgba(0,0,0,0.92)] z-0"></div>

    <!-- 상단 헤더: 타이틀, 전적 스코어보드, 사운드 제어 -->

                ♠A
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-amber-100">

        </div>

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <svg id="soundOffIcon" class="w-5 h-5 hidden text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="w-full max-w-3xl flex-1 flex flex-col justify-center gap-3 sm:gap-5 my-2 relative z-10">

                        <!-- 턱시도 소매 & 재킷 주름 -->

            <div class="flex items-center gap-2.5 z-10">

        <!-- 2. 중앙 테이블 영역: 바이시클 카드 뭉치(덱) + 진행 안내/승패 결과 배너 -->
        <section class="flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-8 py-2.5 px-4 rounded-3xl bg-black/45 border border-emerald-400/15 shadow-inner">
            
            <!-- 바이시클 카드 뭉치 (Deck Pile) -->
            <div class="flex items-center gap-3">

                            <circle cx="30" cy="45" r="16" fill="#450a0a" stroke="#fcd34d" stroke-width="1.2"/>
                            <circle cx="30" cy="45" r="12" fill="none" stroke="#fca5a5" stroke-width="0.7" stroke-dasharray="1.5 1.5"/>
                            <path d="M30 25 L33 31 L30 29 L27 31 Z M30 65 L33 59 L30 61 L27 59 Z M12 45 L18 42 L16 45 L18 48 Z M48 45 L42 42 L44 45 L42 48 Z" fill="#fde68a"/>
                            <text x="30" y="48" font-size="8.5" font-weight="900" fill="#fef08a" text-anchor="middle" font-family="Playfair Display, serif">808</text>

                <div class="text-left">

                    <div class="text-[11px] text-emerald-200/75">스페이드·하트·클로버·다이아</div>

            <!-- 중앙 상태 메시지 및 결과 판정 박스 -->
            <div class="flex-1 flex flex-col items-center justify-center text-center min-h-[72px]">
                <div id="statusBanner" class="px-4 py-2.5 rounded-2xl bg-black/70 border border-emerald-500/30 text-sm sm:text-base font-bold text-emerald-100 shadow-md">
                    아래 [카드 나누기]를 누르면 딜러 패가 자동으로 열립니다!

                <div id="detailFormula" class="text-xs text-amber-200/90 font-semibold mt-1.5 hidden"></div>
            </div>
        </section>

        <!-- 3. 플레이어 (나) 영역 -->
        <section class="flex flex-col items-center gap-2">
            <!-- 내 카드 2장 슬롯 -->
            <div id="playerCardsArea" class="flex items-center justify-center gap-3 sm:gap-5 min-h-[152px] sm:min-h-[182px]">
                <div class="card-slot rounded-xl border-2 border-dashed border-emerald-400/20 bg-black/20 flex items-center justify-center text-emerald-200/25 text-xs font-semibold">
                    내 패 1
                </div>
                <div class="card-slot rounded-xl border-2 border-dashed border-emerald-400/20 bg-black/20 flex items-center justify-center text-emerald-200/25 text-xs font-semibold">
                    내 패 2
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <span class="px-3 py-1 rounded-full bg-black/70 border border-amber-400/30 text-xs sm:text-sm font-bold text-amber-200 shadow-lg">
                    플레이어 (나)
                </span>
                <span id="playerScoreBadge" class="px-3 py-1 rounded-full bg-amber-950/90 border border-amber-400/50 text-xs sm:text-sm font-extrabold text-amber-300 hidden shadow-lg">
                    합계: 0점
                </span>
            </div>
        </section>

    </main>

    <!-- 하단 컨트롤 패널: 단계별 액션 버튼 & 족보(숫자 크기) 안내 -->
    <footer class="relative z-10 w-full max-w-3xl flex flex-col gap-3">
        <!-- 메인 액션 버튼 -->
        <div class="flex items-center justify-center gap-3">
            <button id="actionBtn" class="w-full sm:w-auto sm:min-w-[310px] py-3.5 px-7 rounded-2xl bg-gradient-to-b from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 active:translate-y-0.5 text-slate-950 font-extrabold text-base sm:text-lg shadow-[0_5px_0_#92400e,0_10px_25px_rgba(0,0,0,0.65)] transition-all cursor-pointer flex items-center justify-center gap-2">
                <span id="actionBtnIcon">🃏</span>
                <span id="actionBtnText">카드 2장씩 나누기</span>
            </button>

            <button id="resetDeckBtn" title="덱 52장 새로 셔플 및 전적 초기화" class="py-3.5 px-4 rounded-2xl bg-black/60 hover:bg-black/80 border border-white/15 text-xs sm:text-sm font-bold text-emerald-200 transition-colors cursor-pointer shrink-0">
                덱 리셋
            </button>
        </div>

        <!-- 카드 크기 순위표 (2 ~ A) -->
        <div class="bg-black/50 border border-white/10 rounded-xl px-3 py-2 flex flex-wrap items-center justify-center gap-1.5 text-[11px] sm:text-xs text-emerald-100/90">
            <span class="font-bold text-amber-300 mr-1">숫자 크기 순서:</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">2</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">3</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">4</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">5</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">6</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">7</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">8</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">9</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-white/10">10</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-200 font-bold">J(11)</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-200 font-bold">Q(12)</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-200 font-bold">K(13)</span>
            <span>&lt;</span>
            <span class="px-1.5 py-0.5 rounded bg-rose-500/30 text-amber-300 font-extrabold border border-amber-400/40">A(14)</span>
        </div>
    </footer>

    <script>
        /**
         * 바이시클 2장 하이카드 대결 게임 로직
         * - 플레이어 승률 하향 조정 (딜러가 고득점 카드를 더 자주 가져가도록 조정)
         */
        document.addEventListener('DOMContentLoaded', () => {
            // 문양 및 숫자 정의
            const SUITS = [
                { id: 'spade', symbol: '♠', name: '스페이드', color: 'text-slate-900' },
                { id: 'heart', symbol: '♥', name: '하트', color: 'text-red-600' },
                { id: 'club', symbol: '♣', name: '클로버', color: 'text-slate-900' },
                { id: 'diamond', symbol: '♦', name: '다이아몬드', color: 'text-red-600' }
            ];

            const RANKS = [
                { label: '2', value: 2 },
                { label: '3', value: 3 },
                { label: '4', value: 4 },
                { label: '5', value: 5 },
                { label: '6', value: 6 },
                { label: '7', value: 7 },
                { label: '8', value: 8 },
                { label: '9', value: 9 },
                { label: '10', value: 10 },
                { label: 'J', value: 11 },
                { label: 'Q', value: 12 },
                { label: 'K', value: 13 },
                { label: 'A', value: 14 }
            ];

            // DOM 요소
            const dealerHandsContainer = document.getElementById('dealerHandsContainer');
            const deckVisualPile = document.getElementById('deckVisualPile');
            const opponentCardsArea = document.getElementById('opponentCardsArea');
            const playerCardsArea = document.getElementById('playerCardsArea');
            const opponentScoreBadge = document.getElementById('opponentScoreBadge');
            const playerScoreBadge = document.getElementById('playerScoreBadge');
            const deckCountEl = document.getElementById('deckCount');
            const statusBanner = document.getElementById('statusBanner');
            const detailFormula = document.getElementById('detailFormula');
            const actionBtn = document.getElementById('actionBtn');
            const actionBtnIcon = document.getElementById('actionBtnIcon');
            const actionBtnText = document.getElementById('actionBtnText');
            const resetDeckBtn = document.getElementById('resetDeckBtn');
            const winCountEl = document.getElementById('winCount');
            const loseCountEl = document.getElementById('loseCount');
            const drawCountEl = document.getElementById('drawCount');
            const soundToggleBtn = document.getElementById('soundToggleBtn');
            const soundOnIcon = document.getElementById('soundOnIcon');
            const soundOffIcon = document.getElementById('soundOffIcon');

            // 게임 상태
            let deck = [];
            let opponentHand = [];
            let playerHand = [];
            let playerRevealed = [false, false];
            let gameState = 'READY';
            let stats = { win: 0, lose: 0, draw: 0 };
            let isSoundEnabled = true;
            let synth = null;

            function initAudio() {
                if (!synth && typeof Tone !== 'undefined') {
                    synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    synth.volume.value = -8;
                }
            }

            function playSound(type) {
                if (!isSoundEnabled) return;
                try {
                    initAudio();
                    if (Tone.context.state !== 'running') {
                        Tone.start();
                    }
                    const now = Tone.now();
                    if (type === 'shuffle') {
                        for (let i = 0; i < 7; i++) {
                            synth.triggerAttackRelease(i % 2 === 0 ? 'G3' : 'B3', '64n', now + i * 0.075);
                        }
                    } else if (type === 'deal') {
                        synth.triggerAttackRelease('C5', '32n', now);
                    } else if (type === 'flip') {
                        synth.triggerAttackRelease('E5', '32n', now);
                    } else if (type === 'win') {
                        synth.triggerAttackRelease('C4', '8n', now);
                        synth.triggerAttackRelease('E4', '8n', now + 0.1);
                        synth.triggerAttackRelease('G4', '8n', now + 0.2);
                        synth.triggerAttackRelease('C5', '4n', now + 0.3);
                    } else if (type === 'lose') {
                        synth.triggerAttackRelease('G3', '8n', now);
                        synth.triggerAttackRelease('E3', '8n', now + 0.12);
                        synth.triggerAttackRelease('C3', '4n', now + 0.25);
                    } else if (type === 'draw') {
                        synth.triggerAttackRelease('D4', '8n', now);
                        synth.triggerAttackRelease('D4', '8n', now + 0.15);
                    }
                } catch (e) {
                    console.warn('Sound error:', e);
                }
            }

            function createAndShuffleDeck() {
                const newDeck = [];
                for (const suit of SUITS) {
                    for (const rank of RANKS) {
                        newDeck.push({ suit, rank });
                    }
                }
                for (let i = newDeck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
                }
                deck = newDeck;
                updateDeckCount();
            }

            function updateDeckCount() {
                deckCountEl.textContent = deck.length;
            }

            // 바이시클(Bicycle) 전통 상하 대칭 코트 카드(J, Q, K) 일러스트 SVG 생성기
            function createBicycleCourtSVG(rankLabel, suit) {
                const isRed = suit.id === 'heart' || suit.id === 'diamond';
                const primary = isRed ? '#dc2626' : '#1e293b';
                const secondary = isRed ? '#1e293b' : '#dc2626';
                const gold = '#eab308';
                const skin = '#fde68a';

                let halfCharacter = '';
                if (rankLabel === 'J') {
                    halfCharacter = `
                        <line x1="16" y1="8" x2="16" y2="54" stroke="${gold}" stroke-width="2"/>
                        <path d="M16 6 L13 13 L16 11 L19 13 Z" fill="${primary}"/>
                        <path d="M16 12 C11 12, 11 18, 16 18 Z" fill="${secondary}"/>
                        <path d="M21 54 L23 37 L57 37 L59 54 Z" fill="${primary}"/>
                        <path d="M27 37 L53 37 L55 54 L25 54 Z" fill="${gold}"/>
                        <path d="M27 37 L55 54 M53 37 L25 54 M40 37 L40 54 M26 45 L54 45" stroke="${secondary}" stroke-width="1.5"/>
                        <path d="M32 36 L40 40 L48 36 Z" fill="#ffffff" stroke="${secondary}" stroke-width="1"/>
                        <path d="M29 23 C27 29, 28 34, 31 35 L49 35 C52 34, 53 29, 51 23 Z" fill="${gold}"/>
                        <ellipse cx="40" cy="28" rx="6.5" ry="7.5" fill="${skin}" stroke="${secondary}" stroke-width="1"/>
                        <circle cx="37.5" cy="26.5" r="1" fill="${secondary}"/>
                        <circle cx="42.5" cy="26.5" r="1" fill="${secondary}"/>
                        <path d="M40 26.5 L39.2 30 L40.8 30" fill="none" stroke="${secondary}" stroke-width="0.9"/>
                        <path d="M38 32 Q40 33.5 42 32" fill="none" stroke="${primary}" stroke-width="1"/>
                        <path d="M28 22 Q40 14 52 22 L50 24 Q40 18 30 24 Z" fill="${primary}" stroke="${secondary}" stroke-width="0.9"/>
                        <path d="M48 20 Q55 13 60 16 Q54 20 49 22 Z" fill="${gold}" stroke="${primary}" stroke-width="0.9"/>
                    `;
                } else if (rankLabel === 'Q') {
                    halfCharacter = `
                        <path d="M22 54 C23 39, 31 36, 40 36 C49 36, 57 39, 58 54 Z" fill="${primary}"/>
                        <path d="M28 37 L40 48 L52 37 L48 54 L32 54 Z" fill="${gold}"/>
                        <path d="M33 37 L40 44 L47 37 Z" fill="#ffffff"/>
                        <path d="M27 21 C24 28, 24 35, 27 39 L53 39 C56 35, 56 28, 53 21 Z" fill="${secondary}"/>
                        <path d="M29 22 C28 28, 29 33, 31 36 L49 36 C51 33, 52 28, 51 22 Z" fill="${gold}"/>
                        <ellipse cx="40" cy="27" rx="6.5" ry="7.5" fill="${skin}" stroke="${secondary}" stroke-width="1"/>
                        <circle cx="37.5" cy="25.5" r="0.9" fill="${secondary}"/>
                        <circle cx="42.5" cy="25.5" r="0.9" fill="${secondary}"/>
                        <path d="M38 31 Q40 32.5 42 31" fill="none" stroke="#dc2626" stroke-width="1.1"/>
                        <path d="M32 21 L31 14 L35 17 L40 11 L45 17 L49 14 L48 21 Z" fill="${gold}" stroke="${secondary}" stroke-width="1"/>
                        <circle cx="40" cy="16.5" r="1.1" fill="${primary}"/>
                        <line x1="58" y1="30" x2="54" y2="52" stroke="#15803d" stroke-width="1.6"/>
                        <circle cx="58" cy="27" r="4" fill="#dc2626" stroke="${gold}" stroke-width="1"/>
                        <circle cx="58" cy="27" r="1.6" fill="${gold}"/>
                    `;
                } else {
                    halfCharacter = `
                        <path d="M15 8 L17 8 L18 42 L15 42 Z" fill="#e2e8f0" stroke="${secondary}" stroke-width="1"/>
                        <line x1="16" y1="8" x2="16" y2="41" stroke="${secondary}" stroke-width="0.7"/>
                        <rect x="11" y="41" width="10" height="2.5" rx="0.8" fill="${gold}" stroke="${secondary}" stroke-width="0.9"/>
                        <rect x="15" y="43.5" width="2" height="7" fill="${primary}"/>
                        <path d="M22 54 L24 36 L56 36 L58 54 Z" fill="${primary}"/>
                        <path d="M27 36 L53 36 L55 54 L25 54 Z" fill="${secondary}"/>
                        <path d="M32 36 L40 47 L48 36 L46 54 L34 54 Z" fill="${gold}"/>
                        <path d="M26 35 Q40 40 54 35 L52 38 Q40 43 28 38 Z" fill="#ffffff" stroke="${secondary}" stroke-width="0.9"/>
                        <circle cx="30" cy="26" r="3.8" fill="${gold}" stroke="${secondary}" stroke-width="0.9"/>
                        <circle cx="50" cy="26" r="3.8" fill="${gold}" stroke="${secondary}" stroke-width="0.9"/>
                        <ellipse cx="40" cy="27" rx="6.5" ry="7.5" fill="${skin}" stroke="${secondary}" stroke-width="1"/>
                        <path d="M33 29.5 Q36 35 40 36 Q44 35 47 29.5 Q43 31.5 40 31 Q37 31.5 33 29.5 Z" fill="${gold}" stroke="${secondary}" stroke-width="0.9"/>
                        <circle cx="37.5" cy="25" r="0.9" fill="${secondary}"/>
                        <circle cx="42.5" cy="25" r="0.9" fill="${secondary}"/>
                        <path d="M31 19 L30 11 L35 15 L40 9 L45 15 L50 11 L49 19 Z" fill="${gold}" stroke="${secondary}" stroke-width="1"/>
                        <rect x="31" y="17" width="18" height="2.5" fill="${primary}" stroke="${secondary}" stroke-width="0.8"/>
                    `;
                }

                return `
                    <svg viewBox="0 0 80 108" class="w-full h-full rounded-[6px] border-[1.5px] ${isRed ? 'border-red-700/70 bg-amber-50/40' : 'border-slate-800/70 bg-slate-50/60'} shadow-inner overflow-hidden">
                        <g>${halfCharacter}</g>
                        <line x1="0" y1="55" x2="80" y2="53" stroke="${gold}" stroke-width="2"/>
                        <line x1="0" y1="55" x2="80" y2="53" stroke="${secondary}" stroke-width="0.7" stroke-dasharray="2.5 1.5"/>
                        <g transform="rotate(180 40 54)">${halfCharacter}</g>
                        <text x="68" y="13" font-size="11" fill="${primary}" text-anchor="middle">${suit.symbol}</text>
                        <text x="12" y="103" font-size="11" fill="${primary}" text-anchor="middle" transform="rotate(180 12 99)">${suit.symbol}</text>
                    </svg>
                `;
            }

            function createCardHTML(card, owner, index) {
                const { suit, rank } = card;
                const isCourtCard = ['J', 'Q', 'K'].includes(rank.label);

                let centerArt = '';
                if (rank.label === 'A' && suit.id === 'spade') {
                    centerArt = `
                        <div class="flex flex-col items-center justify-center w-full h-full">
                            <svg viewBox="0 0 80 95" class="w-14 h-18 sm:w-18 sm:h-22 drop-shadow-sm">
                                <circle cx="40" cy="44" r="24" fill="none" stroke="#0f172a" stroke-width="1.1" stroke-dasharray="2 2" opacity="0.5"/>
                                <circle cx="40" cy="44" r="20" fill="none" stroke="#b45309" stroke-width="0.9" opacity="0.65"/>
                                <path d="M40 14 C29 28, 18 36, 18 47 C18 55, 25 59, 32 57 C35 56, 37 54, 38 52 L34 67 L46 67 L42 52 C43 54, 45 56, 48 57 C55 59, 62 55, 62 47 C62 36, 51 28, 40 14 Z" fill="#0f172a"/>
                                <path d="M40 21 C34 30, 27 36, 27 43 C27 47, 31 49, 35 48" fill="none" stroke="#eab308" stroke-width="1" opacity="0.8"/>
                                <text x="40" y="80" font-size="7" font-weight="900" fill="#1e293b" text-anchor="middle" letter-spacing="1.2" font-family="Playfair Display, serif">BICYCLE</text>
                                <text x="40" y="88" font-size="5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.8">US PLAYING CARD CO.</text>
                            </svg>
                        </div>
                    `;
                } else if (isCourtCard) {
                    centerArt = `
                        <div class="w-[58px] h-[86px] sm:w-[70px] sm:h-[102px] flex items-center justify-center p-[2px] rounded-[6px] bg-gradient-to-b from-amber-300/60 via-amber-500/40 to-amber-300/60 shadow-sm overflow-hidden">
                            ${createBicycleCourtSVG(rank.label, suit)}
                        </div>
                    `;
                } else {
                    const pipCount = Math.min(rank.value, 10);
                    let pipGridHTML = '';
                    if (rank.label === 'A') {
                        pipGridHTML = `<span class="text-4xl sm:text-5xl leading-none ${suit.color} drop-shadow-[0_2px_2px_rgba(0,0,0,0.18)]">${suit.symbol}</span>`;
                    } else if (pipCount <= 4) {
                        pipGridHTML = `<div class="grid ${pipCount === 2 ? 'grid-cols-1 gap-3' : 'grid-cols-2 gap-x-2.5 gap-y-1.5'} place-items-center">
                            ${Array(pipCount).fill(`<span class="text-lg sm:text-xl leading-none ${suit.color} drop-shadow-[0_1px_1px_rgba(0,0,0,0.15)]">${suit.symbol}</span>`).join('')}
                        </div>`;
                    } else {
                        pipGridHTML = `<div class="relative flex items-center justify-center">
                            <span class="text-3xl sm:text-4xl leading-none ${suit.color} drop-shadow-[0_2px_2px_rgba(0,0,0,0.16)]">${suit.symbol}</span>
                            <span class="absolute -top-2.5 -left-2.5 text-xs ${suit.color} opacity-75">${suit.symbol}</span>
                            <span class="absolute -bottom-2.5 -right-2.5 text-xs ${suit.color} opacity-75 rotate-180">${suit.symbol}</span>
                        </div>`;
                    }
                    centerArt = `
                        <div class="w-[52px] h-[78px] sm:w-[62px] sm:h-[94px] rounded-md border border-stone-300/60 bg-white/40 flex items-center justify-center overflow-hidden">
                            ${pipGridHTML}
                        </div>
                    `;
                }

                return `
                    <div id="${owner}-slot-${index}" class="card-slot animate-deal ${owner === 'player' ? 'card-clickable' : ''}" style="animation-delay: ${index * 0.08}s">
                        <div id="${owner}-card-${index}" class="card-inner">
                            <div class="card-face bicycle-back">
                                <div class="bicycle-back-pattern">
                                    <svg viewBox="0 0 100 145" class="w-full h-full">
                                        <circle cx="14" cy="14" r="6" fill="none" stroke="#fde68a" stroke-width="0.9" opacity="0.75"/>
                                        <circle cx="86" cy="14" r="6" fill="none" stroke="#fde68a" stroke-width="0.9" opacity="0.75"/>
                                        <circle cx="14" cy="131" r="6" fill="none" stroke="#fde68a" stroke-width="0.9" opacity="0.75"/>
                                        <circle cx="86" cy="131" r="6" fill="none" stroke="#fde68a" stroke-width="0.9" opacity="0.75"/>
                                        <path d="M22 18 Q50 4 78 18 Q50 32 22 18 Z" fill="none" stroke="#fecaca" stroke-width="0.9" opacity="0.7"/>
                                        <path d="M22 127 Q50 141 78 127 Q50 113 22 127 Z" fill="none" stroke="#fecaca" stroke-width="0.9" opacity="0.7"/>
                                        <circle cx="50" cy="72.5" r="24" fill="#450a0a" stroke="#fcd34d" stroke-width="1.3"/>
                                        <circle cx="50" cy="72.5" r="19" fill="none" stroke="#fecaca" stroke-width="0.8" stroke-dasharray="2.5 1.5"/>
                                        <circle cx="50" cy="72.5" r="14" fill="#7f1d1d" stroke="#fde047" stroke-width="0.8"/>
                                        <text x="50" y="76" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle" font-family="Playfair Display, serif" letter-spacing="0.5">808</text>
                                    </svg>
                                </div>
                            </div>
                            <div class="card-face card-front p-2 flex flex-col justify-between">
                                <div class="flex justify-between items-start">
                                    <span class="text-xs sm:text-sm font-black font-card ${suit.color}">${rank.label}</span>
                                    <span class="text-xs ${suit.color}">${suit.symbol}</span>
                                </div>
                                <div class="flex items-center justify-center flex-1">
                                    ${centerArt}
                                </div>
                                <div class="flex justify-between items-end rotate-180">
                                    <span class="text-xs sm:text-sm font-black font-card ${suit.color}">${rank.label}</span>
                                    <span class="text-xs ${suit.color}">${suit.symbol}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function dealCards() {
                if (deck.length < 4) {
                    createAndShuffleDeck();
                }

                const totalWins = stats.win;
                let playerAdvantage = true;

                if (totalWins <= 2) {
                    playerAdvantage = true;
                } else {
                    const loseChance = Math.min(0.85, 0.35 + (totalWins * 0.08));
                    playerAdvantage = Math.random() >= loseChance;
                }

                deck.sort((a, b) => b.rank.value - a.rank.value);

                if (playerAdvantage) {
                    playerHand = [deck.shift(), deck.shift()];
                    opponentHand = [deck.pop(), deck.pop()];
                } else {
                    opponentHand = [deck.shift(), deck.shift()];
                    playerHand = [deck.pop(), deck.pop()];
                }

                for (let i = deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [deck[i], deck[j]] = [deck[j], deck[i]];
                }

                playerRevealed = [false, false];
                updateDeckCount();

                dealerHandsContainer.classList.remove('dealer-hands-dealing');
                void dealerHandsContainer.offsetWidth;
                dealerHandsContainer.classList.add('dealer-hands-dealing');

                opponentScoreBadge.classList.add('hidden');
                playerScoreBadge.classList.add('hidden');
                detailFormula.classList.add('hidden');

                opponentCardsArea.innerHTML = opponentHand
                    .map((card, idx) => createCardHTML(card, 'opp', idx))
                    .join('');

                playerCardsArea.innerHTML = playerHand
                    .map((card, idx) => createCardHTML(card, 'player', idx))
                    .join('');

                [0, 1].forEach(idx => {
                    const slotEl = document.getElementById(`player-slot-${idx}`);
                    if (slotEl) {
                        slotEl.addEventListener('click', () => {
                            if (gameState === 'PLAYER_TURN' && !playerRevealed[idx]) {
                                revealSinglePlayerCard(idx);
                            }
                        });
                    }
                });

                gameState = 'PLAYER_TURN';
                playSound('deal');

                statusBanner.className = 'px-4 py-2.5 rounded-2xl bg-black/75 border border-rose-400/40 text-sm sm:text-base font-bold text-rose-100 shadow-md';
                statusBanner.textContent = '딜러가 강력한 패를 오픈합니다...';

                const oppSum = opponentHand[0].rank.value + opponentHand[1].rank.value;
                setTimeout(() => {
                    const oppCard0 = document.getElementById('opp-card-0');
                    if (oppCard0) oppCard0.classList.add('is-flipped');
                    playSound('flip');
                }, 380);

                setTimeout(() => {
                    const oppCard1 = document.getElementById('opp-card-1');
                    if (oppCard1) oppCard1.classList.add('is-flipped');
                    playSound('flip');

                    opponentScoreBadge.textContent = `합계: ${oppSum}점 (${opponentHand[0].rank.label}+${opponentHand[1].rank.label})`;
                    opponentScoreBadge.classList.remove('hidden');

                    if (gameState === 'PLAYER_TURN') {
                        statusBanner.className = 'px-4 py-2.5 rounded-2xl bg-black/80 border border-amber-400/50 text-sm sm:text-base font-bold text-amber-100 shadow-md';
                        statusBanner.textContent = `딜러 점수가 무려 ${oppSum}점입니다! 내 첫 카드를 오픈하세요.`;
                    }
                }, 680);

                actionBtnIcon.textContent = '👆';
                actionBtnText.textContent = '내 첫 번째 카드 까기 (1/2)';
                actionBtn.className = 'w-full sm:w-auto sm:min-w-[310px] py-3.5 px-7 rounded-2xl bg-gradient-to-b from-sky-400 to-blue-600 hover:from-sky-300 hover:to-blue-500 active:translate-y-0.5 text-white font-extrabold text-base sm:text-lg shadow-[0_5px_0_#1e3a8a,0_10px_25px_rgba(0,0,0,0.65)] transition-all cursor-pointer flex items-center justify-center gap-2';
            }

            function revealSinglePlayerCard(cardIndex) {
                if (gameState !== 'PLAYER_TURN' || playerRevealed[cardIndex]) return;

                playerRevealed[cardIndex] = true;
                const cardEl = document.getElementById(`player-card-${cardIndex}`);
                const slotEl = document.getElementById(`player-slot-${cardIndex}`);
                if (cardEl) cardEl.classList.add('is-flipped');
                if (slotEl) slotEl.classList.remove('card-clickable');

                playSound('flip');

                const revealedCount = playerRevealed.filter(Boolean).length;
                const currentSum = playerHand.reduce((acc, card, idx) => acc + (playerRevealed[idx] ? card.rank.value : 0), 0);

                if (revealedCount === 1) {
                    const oppSum = opponentHand[0].rank.value + opponentHand[1].rank.value;
                    const openedCard = playerHand[cardIndex];
                    playerScoreBadge.textContent = `현재: ${currentSum}점 (${openedCard.rank.label}+?)`;
                    playerScoreBadge.classList.remove('hidden');

                    statusBanner.className = 'px-4 py-2.5 rounded-2xl bg-black/80 border border-sky-400/50 text-sm sm:text-base font-bold text-sky-100 shadow-md';
                    statusBanner.textContent = `첫 패 ${openedCard.suit.symbol}${openedCard.rank.label} (${currentSum}점)! 딜러(${oppSum}점)를 따라잡으려면 마지막 카드를 오픈하세요!`;

                    actionBtnIcon.textContent = '🔥';
                    actionBtnText.textContent = '내 두 번째 카드 까기 (2/2)';
                    actionBtn.className = 'w-full sm:w-auto sm:min-w-[310px] py-3.5 px-7 rounded-2xl bg-gradient-to-b from-rose-500 to-rose-700 hover:from-rose-400 hover:to-rose-600 active:translate-y-0.5 text-white font-extrabold text-base sm:text-lg shadow-[0_5px_0_#881337,0_10px_25px_rgba(0,0,0,0.65)] transition-all cursor-pointer flex items-center justify-center gap-2';
                } else {
                    judgeFinalResult();
                }
            }

            function judgeFinalResult() {
                const oppSum = opponentHand[0].rank.value + opponentHand[1].rank.value;
                const playerSum = playerHand[0].rank.value + playerHand[1].rank.value;

                setTimeout(() => {
                    playerScoreBadge.textContent = `합계: ${playerSum}점 (${playerHand[0].rank.label}+${playerHand[1].rank.label})`;
                    playerScoreBadge.classList.remove('hidden');

                    detailFormula.textContent = `딜러 [${opponentHand[0].suit.symbol}${opponentHand[0].rank.label} + ${opponentHand[1].suit.symbol}${opponentHand[1].rank.label} = ${oppSum}]  VS  나 [${playerHand[0].suit.symbol}${playerHand[0].rank.label} + ${playerHand[1].suit.symbol}${playerHand[1].rank.label} = ${playerSum}]`;
                    detailFormula.classList.remove('hidden');

                    statusBanner.classList.remove('animate-banner');
                    void statusBanner.offsetWidth;
                    statusBanner.classList.add('animate-banner');

                    if (playerSum > oppSum) {
                        stats.win++;
                        winCountEl.textContent = stats.win;
                        statusBanner.className = 'animate-banner px-5 py-2.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black text-base sm:text-lg shadow-xl border-2 border-white';
                        statusBanner.textContent = `🎉 기적의 승리! (${playerSum}점 vs ${oppSum}점)`;
                        playSound('win');
                    } else if (playerSum < oppSum) {
                        stats.lose++;
                        loseCountEl.textContent = stats.lose;
                        statusBanner.className = 'animate-banner px-5 py-2.5 rounded-2xl bg-rose-950/95 text-rose-100 font-black text-base sm:text-lg shadow-xl border border-rose-400';
                        statusBanner.textContent = `😢 딜러의 압승! (${playerSum}점 vs ${oppSum}점)`;
                        playSound('lose');
                    } else {
                        stats.draw++;
                        drawCountEl.textContent = stats.draw;
                        statusBanner.className = 'animate-banner px-5 py-2.5 rounded-2xl bg-slate-900/95 text-amber-200 font-black text-base sm:text-lg shadow-xl border border-amber-300/60';
                        statusBanner.textContent = `🤝 무승부입니다! (${playerSum}점 동점)`;
                        playSound('draw');
                    }
                }, 320);

                gameState = 'RESULT';

                actionBtnIcon.textContent = '🔄';
                actionBtnText.textContent = '다음 판 카드 나누기';
                actionBtn.className = 'w-full sm:w-auto sm:min-w-[310px] py-3.5 px-7 rounded-2xl bg-gradient-to-b from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 active:translate-y-0.5 text-slate-950 font-extrabold text-base sm:text-lg shadow-[0_5px_0_#92400e,0_10px_25px_rgba(0,0,0,0.65)] transition-all cursor-pointer flex items-center justify-center gap-2';
            }

            actionBtn.addEventListener('click', () => {
                if (gameState === 'READY' || gameState === 'RESULT') {
                    dealCards();
                } else if (gameState === 'PLAYER_TURN') {
                    const nextIndex = playerRevealed.findIndex(revealed => !revealed);
                    if (nextIndex !== -1) {
                        revealSinglePlayerCard(nextIndex);
                    }
                }
            });

            resetDeckBtn.addEventListener('click', () => {
                createAndShuffleDeck();
                stats = { win: 0, lose: 0, draw: 0 };
                winCountEl.textContent = '0';
                loseCountEl.textContent = '0';
                drawCountEl.textContent = '0';
                gameState = 'READY';

                opponentScoreBadge.classList.add('hidden');
                playerScoreBadge.classList.add('hidden');
                detailFormula.classList.add('hidden');

                opponentCardsArea.innerHTML = `
                    <div class="card-slot rounded-xl border-2 border-dashed border-emerald-400/20 bg-black/20 flex items-center justify-center text-emerald-200/25 text-xs font-semibold">딜러 패 1</div>
                    <div class="card-slot rounded-xl border-2 border-dashed border-emerald-400/20 bg-black/20 flex items-center justify-center text-emerald-200/25 text-xs font-semibold">딜러 패 2</div>
                `;
                playerCardsArea.innerHTML = `
                    <div class="card-slot rounded-xl border-2 border-dashed border-emerald-400/20 bg-black/20 flex items-center justify-center text-emerald-200/25 text-xs font-semibold">내 패 1</div>
                    <div class="card-slot rounded-xl border-2 border-dashed border-emerald-400/20 bg-black/20 flex items-center justify-center text-emerald-200/25 text-xs font-semibold">내 패 2</div>
                `;

                statusBanner.className = 'px-4 py-2.5 rounded-2xl bg-black/70 border border-emerald-500/30 text-sm sm:text-base font-bold text-emerald-100 shadow-md';
                statusBanner.textContent = '새 바이시클 덱(52장)을 셔플했습니다! 카드를 나누세요.';

                actionBtnIcon.textContent = '🃏';
                actionBtnText.textContent = '카드 2장씩 나누기';
                actionBtn.className = 'w-full sm:w-auto sm:min-w-[310px] py-3.5 px-7 rounded-2xl bg-gradient-to-b from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 active:translate-y-0.5 text-slate-950 font-extrabold text-base sm:text-lg shadow-[0_5px_0_#92400e,0_10px_25px_rgba(0,0,0,0.65)] transition-all cursor-pointer flex items-center justify-center gap-2';
                playSound('deal');
            });

            soundToggleBtn.addEventListener('click', () => {
                isSoundEnabled = !isSoundEnabled;
                soundOnIcon.classList.toggle('hidden', !isSoundEnabled);
                soundOffIcon.classList.toggle('hidden', isSoundEnabled);
            });

            createAndShuffleDeck();
        });
    </script>
</body>
</html>
